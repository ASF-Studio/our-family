<script>
const API="https://cursiwpgzaisednzpjsi.supabase.co/functions/v1/family-api";
const cats=[
"🛒 بقالة","🍔 وجبات وأكل","🥤 مشروبات","🍫 حلويات وسناكات",
"🧸 ألعاب","🎮 ترفيه","🎁 هدايا","📚 كتب وقرطاسية",
"🎒 أدوات مدرسية","👕 ملابس وإكسسوارات","⚽ رياضة",
"🧴 عناية ونظافة","🏠 أغراض منزلية","🎨 هوايات وفنون",
"📱 إلكترونيات","🌟 أشياء متنوعة"
];
const allowed=[25,50,75,100,150,200,250,500,1000];
let token=localStorage.getItem("family_token")||"";
let role=localStorage.getItem("family_role")||"";
let account=null,accounts=[],transferType="",selectedPoints=25,operationBusy=false;

async function api(action,data={}){
 const r=await fetch(API,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({action,token,...data})
 });
 const d=await r.json();
 if(!r.ok||d.error)throw Error(d.error||"حدث خطأ");
 return d;
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function msg(id,text,error=false){
 document.getElementById(id).innerHTML='<div class="message '+(error?'error':'')+'">'+escapeHTML(text)+'</div>';
}

function money(n){
 return Number(n||0).toFixed(2)+" ر.س";
}

/* قراءة المبلغ بالريال وتحويله إلى هللات */
function parseHalalasValue(raw){
 raw=String(raw??"").trim().replace(",",".");
 if(!/^\d+(\.\d{1,2})?$/.test(raw))return null;
 const parts=raw.split(".");
 const total=Number(parts[0])*100+Number(((parts[1]||"")+"00").slice(0,2));
 if(!Number.isSafeInteger(total)||total<=0||total>10000000)return null;
 return total;
}

function normalizeDigits(value){
 return String(value??"")
  .replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
  .replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
  .trim();
}

function parseHalalas(id){
 return parseHalalasValue(normalizeDigits(document.getElementById(id).value));
}

function show(id){
 ["home","transfer","convert","store","settings"].forEach(x=>document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function tab(id,btn){
 show(id);
 document.querySelectorAll("#userTabs .tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
}

function adminTab(id,btn){
 ["balances","accountsPanel","settingsPanel"].forEach(x=>{
  document.getElementById("admin-"+x).classList.toggle("hidden",x!==id);
 });
 document.querySelectorAll("#adminTabs .tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
}

function showOperation(title,text){
 document.getElementById("operationLoader").classList.remove("hidden");
 document.getElementById("operationSuccess").classList.add("hidden");
 document.getElementById("operationClose").classList.add("hidden");
 document.getElementById("operationTitle").textContent=title;
 document.getElementById("operationText").textContent=text;
 document.getElementById("operationOverlay").classList.remove("hidden");
}

function operationSuccess(title,text){
 document.getElementById("operationLoader").classList.add("hidden");
 document.getElementById("operationSuccess").classList.remove("hidden");
 document.getElementById("operationTitle").textContent=title;
 document.getElementById("operationText").textContent=text;
 document.getElementById("operationClose").classList.remove("hidden");
}

function closeOperation(){
 document.getElementById("operationOverlay").classList.add("hidden");
 operationBusy=false;
}

async function runOperation(title,text,successTitle,successText,action){
 if(operationBusy)return false;
 operationBusy=true;
 showOperation(title,text);
 try{
  await action();
  operationSuccess(successTitle,successText);
  return true;
 }catch(e){
  document.getElementById("operationOverlay").classList.add("hidden");
  operationBusy=false;
  alert(e.message||"حدث خطأ");
  return false;
 }
}

async function login(){
 if(operationBusy)return;
 const admin=document.getElementById("loginType").value==="admin";
 const btn=document.getElementById("loginBtn");
 btn.disabled=true;
 const ok=await runOperation(
  "جاري تسجيل الدخول",
  "نتحقق من بيانات الحساب، يرجى الانتظار...",
  "تم تسجيل الدخول بنجاح",
  "أهلًا بك في بنك العائلة.",
  async()=>{
   const d=await api(admin?"mamaLogin":"login",{
    pin:document.getElementById("pin").value,
    username:document.getElementById("username").value
   });
   if(!d.token)throw Error("لم يرجع الخادم رمز الدخول");
   token=d.token;
   role=d.role;
   account=d.account;
   localStorage.setItem("family_token",token);
   localStorage.setItem("family_role",role);
   await load();
  }
 );
 btn.disabled=false;
 if(ok)document.getElementById("pin").value="";
}

async function load(){
 const d=await api("getData");
 document.getElementById("login").classList.add("hidden");
 document.getElementById("app").classList.remove("hidden");
 document.getElementById("logoutBtn").classList.remove("hidden");

 if(role==="admin"){
  document.getElementById("userTabs").classList.add("hidden");
  ["home","transfer","convert","store","settings"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById("admin").classList.remove("hidden");
  accounts=d.accounts||[];
  renderAccounts();
 }else{
  account=d.account;
  if(!account||account.is_blocked)throw Error("الحساب موقوف أو غير موجود");
  document.getElementById("admin").classList.add("hidden");
  document.getElementById("userTabs").classList.remove("hidden");
  document.getElementById("name").textContent=account.display_name||account.username;
  document.getElementById("balance").textContent=money(account.balance);
  document.getElementById("points").textContent=Number(account.points||0).toLocaleString("en-US")+" نقطة";
  document.getElementById("convertCurrent").textContent=Number(account.points||0).toLocaleString("en-US");
  updateConvertPreview();
  renderStore();
 }
}

function renderStore(){
 document.getElementById("storeItems").innerHTML=cats.map((c,i)=>`
  <div class="category">
   <div class="category-title">${escapeHTML(c)}</div>
   <input type="text" inputmode="decimal" id="price${i}" placeholder="أدخل السعر بالريال">
   <button class="btn" onclick="buy(${i})">شراء</button>
   <div id="buyMsg${i}"></div>
  </div>`).join("");
}

async function buy(i){
 const halalas=parseHalalas("price"+i);
 if(halalas===null)return msg("buyMsg"+i,"أدخل سعرًا صحيحًا بين 0.01 و100000 ريال",true);
 const price=halalas/100;
 if(!confirm("تأكيد الشراء من قسم "+cats[i]+" بسعر "+money(price)+"؟"))return;
 const ok=await runOperation(
  "جاري تنفيذ الشراء","جاري إتمام عملية الشراء، يرجى الانتظار...",
  "تم الشراء بنجاح","تمت عملية الشراء بنجاح.",
  async()=>{
   await api("purchase",{product:cats[i],amount:price,requestId:crypto.randomUUID()});
   await load();
  }
 );
 if(ok)document.getElementById("price"+i).value="";
}
