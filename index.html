<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2b22">
<title>بنك العائلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--primary:#0d2b22;
--primary-light:#154536;
--gold:#c5a059;
--gold-light:#e6c584;
--bg:#f4f7f6;
--card:#fff;
--text:#1a2e26;
--muted:#5a6e67;
--border:#e2e8e5;
--red:#a93226;
--green:#1e8449;
--shadow:0 10px 25px -5px rgba(13,43,34,.08)
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;flex-direction:column;min-height:100vh;font-size:16px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:white;padding:18px 6%;display:flex;align-items:center;
justify-content:space-between;gap:12px;box-shadow:0 4px 20px #0002
}
.bank-title{font-size:21px;font-weight:bold}
.bank-subtitle{font-size:13px;color:var(--gold-light);margin-top:4px}
.container{max-width:1050px;margin:auto;padding:25px 16px 60px;flex:1;width:100%}
.auth-container{max-width:440px;margin:9vh auto;padding:16px;width:100%}
.auth-card,.card{
background:var(--card);border:1px solid var(--border);
border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)
}
.auth-card{padding:35px}
.auth-logo-area{text-align:center;margin-bottom:28px}
.auth-logo-area h1{font-size:27px;margin:0 0 8px;color:var(--primary)}
.auth-logo-area p{font-size:14px;color:var(--muted)}
.field{margin:16px 0}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
input,select,textarea{
width:100%;padding:13px 15px;border:1.5px solid var(--border);
border-radius:11px;background:white;color:var(--text);font-size:15px
}
input:focus,select:focus,textarea:focus{
border-color:var(--primary);outline:none;box-shadow:0 0 0 3px #0d2b2212
}
.btn{
border:0;border-radius:11px;padding:14px 18px;background:var(--primary);
color:white;font-weight:700;font-size:14px;display:inline-block;
text-align:center;transition:.2s
}
.btn:hover{background:var(--primary-light)}
.btn.gold{background:var(--gold);color:var(--primary)}
.btn.red{background:var(--red);color:white}
.btn.outline{background:transparent;border:1px solid #ffffff77;color:white}
.btn.small{padding:9px 13px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.bank-card-hero{
background:linear-gradient(135deg,#0d2b22,#1f4d3e);
color:white;border-radius:20px;padding:28px;
box-shadow:0 15px 30px #0d2b2230;margin-bottom:24px
}
.bank-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.bank-card-chip{width:42px;height:31px;background:linear-gradient(135deg,#e6c584,#c5a059);border-radius:6px}
.bank-card-balances{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.balance-item span{display:block;font-size:14px;color:#c4d4cd;margin-bottom:9px}
.balance-item strong{font-size:clamp(25px,5vw,36px);font-weight:800;display:block}
.eye-icon{
background:#ffffff22;border:0;color:white;width:30px;height:30px;
border-radius:50%;margin-right:5px
}
.nav-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 20px;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
white-space:nowrap;border:1px solid var(--border);background:white;
color:var(--text);padding:11px 16px;border-radius:10px;font-size:13px;font-weight:700
}
.nav-tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.card-header{
display:flex;justify-content:space-between;align-items:center;
gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)
}
.card-title{font-size:17px;font-weight:800;color:var(--primary)}
.muted{color:var(--muted);font-size:14px;line-height:1.8}
.notice{
background:#f0f4f2;border-radius:12px;padding:14px;font-size:14px;
line-height:1.8;margin:12px 0;border-right:4px solid var(--primary)
}
.transaction-row{
display:flex;justify-content:space-between;align-items:center;
gap:12px;padding:14px 0;border-bottom:1px solid #f0f4f2
}
.transaction-row:last-child{border-bottom:0}
.tx-info h4{margin:0 0 5px;font-size:14px}
.tx-info span{font-size:12px;color:var(--muted);line-height:1.7}
.tx-amount{font-size:14px;font-weight:800;white-space:nowrap}
.tx-amount.plus{color:var(--green)}
.tx-amount.minus{color:var(--red)}
.empty-state{text-align:center;padding:28px;color:var(--muted);font-size:14px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.action-card{
border:1px solid var(--border);border-radius:14px;padding:17px;background:#fff
}
.action-card h3{font-size:15px;margin:0 0 7px;color:var(--primary)}
.action-card p{font-size:12px;color:var(--muted);margin:0 0 12px}
.action-card .field{margin:10px 0}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.preset{
border:1px solid var(--gold);background:#fff9ec;color:#76551b;
border-radius:9px;padding:9px 13px;font-weight:700;font-size:13px
}
.preset:active{background:var(--gold-light)}
footer{
background:var(--primary);color:#a3b8b1;text-align:center;
padding:18px;font-size:12px;margin-top:auto
}
.toast{
position:fixed;bottom:24px;right:50%;transform:translateX(50%);
background:var(--primary);color:white;padding:13px 22px;border-radius:12px;
z-index:99999;max-width:90%;font-size:14px;box-shadow:0 8px 20px #0003
}
.loading-overlay{
position:fixed;inset:0;background:#ffffffdf;z-index:99998;
display:grid;place-items:center;color:var(--primary);font-weight:bold
}
.spinner{
width:36px;height:36px;border:3.5px solid var(--border);
border-top-color:var(--primary);border-radius:50%;
animation:spin .8s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
header{padding:15px 4%}
.bank-card-hero{padding:22px}
.card{padding:18px}
.auth-card{padding:25px}
.quick-grid{grid-template-columns:1fr}
.transaction-row{align-items:flex-start}
}
</style>
</head>

<body>

<div id="loading" class="loading-overlay hidden">
<div>
<div class="spinner"></div>
<div id="loadingText">جاري المعالجة...</div>
</div>
</div>

<header id="header" class="hidden">
<div>
<div class="bank-title">بنك العائلة</div>
<div class="bank-subtitle" id="headerRoleLabel">الحساب الفردي</div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<span id="headerName" style="font-size:14px;font-weight:700"></span>
<button class="btn outline small" onclick="logout()">خروج</button>
</div>
</header>

<section id="loginScreen" class="auth-container">
<div class="auth-card">
<div class="auth-logo-area">
<h1>🏦 بنك العائلة</h1>
<p>تسجيل الدخول إلى حسابك العائلي</p>
</div>
<form id="loginForm" onsubmit="handleLoginSubmit(event)">
<div class="field">
<label>اختر الحساب</label>
<select id="loginFamilyId">
<option value="azoz">عزوز</option>
<option value="sahab">سحاب</option>
<option value="mama">ماما (الإدارة)</option>
</select>
</div>
<div class="field">
<label>الرمز السري</label>
<input id="loginPin" type="password" maxlength="6" placeholder="أدخل الرمز السري" required>
</div>
<button type="submit" id="loginBtn" class="btn gold full">تسجيل الدخول</button>
</form>
</div>
</section>

<main id="app" class="container hidden">

<div class="bank-card-hero" id="bankHeroCard">
<div class="bank-card-top">
<div class="bank-card-chip"></div>
<span id="cardHolderName" style="font-size:13px;color:#e2e8e5">FAMILY BANK</span>
</div>
<div class="bank-card-balances">
<div class="balance-item">
<span>رصيد النقاط
<button class="eye-icon" onclick="toggleHide('points')">👁</button>
</span>
<strong id="myPoints" style="color:var(--gold-light)">0 نقطة</strong>
</div>
<div class="balance-item">
<span>الرصيد النقدي
<button class="eye-icon" onclick="toggleHide('balance')">👁</button>
</span>
<strong id="myBalance">0.00 ر.س</strong>
</div>
</div>
</div>

<div class="card" id="familySummaryCard" style="display:none">
<div class="card-header"><span class="card-title">👨‍👩‍👧‍👦 حسابات العائلة</span></div>
<div id="familySummary"></div>
</div>

<div class="nav-tabs" id="navigation"></div>
<section id="pageContent"></section>
</main>

<footer>جميع الحقوق محفوظة لبنك العائلة ©</footer>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* إعداد الاتصال الحالي */
const SUPABASE_URL = "https://cursiwpgzaisednzpjsi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hZ653h1LL_jnaHMLRw1-ng_vsSyQs57";
const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/family-api`;

let currentUser = null;
let allAccounts = [];
let allRecipients = [];
let allLedger = [];
let allTopUps = [];
let allGifts = [];
let allNotifications = [];
let currentPage = "home";
let isProcessing = false;
let toastTimer;
let hideBalance = false;
let hidePoints = false;

/* التنبيهات المخفية محلياً */
let hiddenNotificationIds = new Set();

function el(id){
 return document.getElementById(id);
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function money(value){
 if(hideBalance) return "••••••";
 return (Number(value)||0).toLocaleString("ar-SA",{
 minimumFractionDigits:2,
 maximumFractionDigits:2
 })+" ر.س";
}

function points(value){
 if(hidePoints) return "••••";
 return (Number(value)||0).toLocaleString("ar-SA")+" نقطة";
}

function showLoading(show,message="جاري المعالجة..."){
 const loader=el("loading");
 if(loader){
  el("loadingText").textContent=message;
  loader.classList.toggle("hidden",!show);
 }
}

function toast(message){
 const t=el("toast");
 if(!t)return;
 t.textContent=message;
 t.classList.remove("hidden");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.add("hidden"),4000);
}

function toggleHide(type){
 if(type==="balance")hideBalance=!hideBalance;
 if(type==="points")hidePoints=!hidePoints;
 renderApp();
}

/* الاتصال بالخادم */
async function apiRequest(payload){
 showLoading(true);
 try{
  const currentUserId=currentUser?.id || localStorage.getItem("family_bank_user_id") || "";
  const response=await fetch(EDGE_FUNCTION_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_ANON_KEY,
    "x-user-id":currentUserId
   },
   body:JSON.stringify(payload)
  });

  const data=await response.json().catch(()=>({}));
  if(!response.ok || !data.success){
   throw new Error(data.error || "تعذر تنفيذ الطلب في الخادم");
  }
  return data;
 }catch(err){
  console.error("API Error:",err);
  toast(err.message || "خطأ في الاتصال بالخادم");
  throw err;
 }finally{
  showLoading(false);
 }
}

/* تحميل البيانات */
function applyData(res){
 if(res.currentUser)currentUser=res.currentUser;
 allAccounts=res.accounts || [];
 allRecipients=res.recipients || [];
 allLedger=res.ledger || [];
 allTopUps=res.topUps || [];
 allGifts=res.gifts || [];
 allNotifications=res.notifications || [];
}

async function refreshData(){
 try{
  const res=await apiRequest({action:"getData"});
  applyData(res);
 }catch(e){
  console.error(e);
 }
}

/* تسجيل الدخول */
async function handleLoginSubmit(event){
 event.preventDefault();
 if(isProcessing)return;

 const familyId=el("loginFamilyId").value;
 const pin=el("loginPin").value.trim();
 const btn=el("loginBtn");

 if(!pin)return toast("أدخل الرمز السري");

 isProcessing=true;
 btn.disabled=true;
 btn.textContent="جاري التحقق...";

 try{
  showLoading(true,"جاري التحقق من بيانات الدخول...");
  const response=await fetch(EDGE_FUNCTION_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_ANON_KEY
   },
   body:JSON.stringify({action:"login",familyId,pin})
  });

  const data=await response.json().catch(()=>({}));
  if(!response.ok || !data.success){
   throw new Error(data.error || "فشل تسجيل الدخول");
  }

  if(!data.currentUser?.id){
   throw new Error("الخادم لم يرجع بيانات الحساب");
  }

  currentUser=data.currentUser;
  localStorage.setItem("family_bank_user_id",String(currentUser.id));

  if(currentUser.blocked){
   throw new Error("حسابك موقوف من الإدارة");
  }

  const res=await apiRequest({action:"getData"});
  applyData(res);

  if(!currentUser?.id)throw new Error("تعذر تجهيز الحساب");

  el("loginPin").value="";
  currentPage="home";
  renderApp();

  el("loginScreen").classList.add("hidden");
  el("header").classList.remove("hidden");
  el("app").classList.remove("hidden");

  toast("مرحباً بك، تم تسجيل الدخول بنجاح");

  if(currentUser.mustChangePin){
   setTimeout(()=>toast("تنبيه: غيّر الرمز السري من إدارة الأمان"),700);
  }

 }catch(err){
  console.error(err);
  currentUser=null;
  localStorage.removeItem("family_bank_user_id");
  toast(err.message || "فشل تسجيل الدخول");
 }finally{
  showLoading(false);
  isProcessing=false;
  btn.disabled=false;
  btn.textContent="تسجيل الدخول";
 }
}

/* استعادة الجلسة */
async function restoreSession(){
 const savedId=localStorage.getItem("family_bank_user_id");
 if(!savedId)return;

 try{
  const res=await apiRequest({action:"getData"});
  applyData(res);

  if(!currentUser?.id || currentUser.blocked){
   logout();
   return;
  }

  el("loginScreen").classList.add("hidden");
  el("header").classList.remove("hidden");
  el("app").classList.remove("hidden");
  renderApp();

 }catch(e){
  console.error("Restore:",e);
  logout();
 }
}

/* عرض التطبيق */
function renderApp(){
 if(!currentUser)return;

 el("headerName").textContent=currentUser.name || "";
 el("cardHolderName").textContent=(currentUser.name || "FAMILY")+" / FAMILY BANK";
 el("headerRoleLabel").textContent=currentUser.is_admin?"لوحة الإدارة":"الحساب الفردي";

 if(currentUser.is_admin){
  el("bankHeroCard").style.display="none";
  el("familySummaryCard").style.display="block";
 }else{
  el("bankHeroCard").style.display="block";
  el("familySummaryCard").style.display="none";
  el("myBalance").textContent=money(currentUser.balance);
  el("myPoints").textContent=points(currentUser.points);
 }

 renderFamilySummary();
 renderNav();
 renderPage();
}

function renderFamilySummary(){
 const container=el("familySummary");
 if(!container || !currentUser?.is_admin)return;

 container.innerHTML=allAccounts.map(acc=>`
 <div class="transaction-row">
  <div>
   <h4>${escapeHTML(acc.name)}</h4>
   <span>${acc.blocked?"🔴 موقوف":"🟢 نشط"}</span>
  </div>
  <div style="text-align:left">
   <div style="font-weight:800">${money(acc.balance)}</div>
   <div style="font-size:13px;color:var(--gold)">${points(acc.points)}</div>
  </div>
 </div>
 `).join("") || '<div class="empty-state">لا توجد حسابات</div>';
}

/* القائمة */
function renderNav(){
 const unread=allNotifications.filter(n=>!n.read && !hiddenNotificationIds.has(String(n.id))).length;

 const items=currentUser.is_admin
 ?[
  ["home","الرئيسية"],
  ["admin","الإدارة والعمليات"],
  ["ledger","السجل"],
  ["notifications",`التنبيهات (${unread})`],
  ["settings","إدارة الأمان"]
 ]
 :[
  ["home","الرئيسية"],
  ["convert","تحويل النقاط"],
  ["topup","شحن الرصيد"],
  ["gifts","الهدايا"],
  ["purchase","المشتريات"],
  ["ledger","السجل"],
  ["notifications",`التنبيهات (${unread})`],
  ["settings","إدارة الأمان"]
 ];

 el("navigation").innerHTML=items.map(([id,label])=>`
 <button class="nav-tab ${currentPage===id?"active":""}" onclick="go('${id}')">${label}</button>
 `).join("");
}

function go(page){
 currentPage=page;
 renderApp();
}

function renderPage(){
 const pages={
  home:pageHome,
  convert:pageConvert,
  topup:pageTopUp,
  gifts:pageGifts,
  purchase:pagePurchase,
  ledger:pageLedger,
  notifications:pageNotifications,
  admin:pageAdmin,
  settings:pageSettings
 };
 const container=el("pageContent");
 if(container && pages[currentPage])pages[currentPage](container);
}

/* الرئيسية */
function pageHome(c){
 c.innerHTML=`
 <div class="card">
  <div class="card-header">
   <span class="card-title">🌟 النقاط والمكافآت</span>
  </div>
  <p class="muted">
   ${currentUser.is_admin
    ?"أهلاً بك يا ماما، من هنا تقدرين تتابعين حسابات أفراد العائلة."
    :"كل 1000 نقطة تعادل 5 ريالات. استمتع بجمع النقاط والمكافآت."}
  </p>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
   ${!currentUser.is_admin?`
    <button class="btn gold" onclick="go('convert')">تحويل النقاط</button>
    <button class="btn" onclick="go('gifts')">إرسال هدية</button>
   `:`
    <button class="btn gold" onclick="go('admin')">إدارة الأرصدة</button>
   `}
  </div>
 </div>

 <div class="card">
  <div class="card-header"><span class="card-title">⚡ الخدمات السريعة</span></div>
  ${currentUser.is_admin?`
   <button class="btn full" onclick="go('admin')">فتح الإدارة والعمليات</button>
  `:`
   <div class="quick-grid">
    <div class="action-card">
     <h3>💰 شحن الرصيد</h3>
     <p>أرسل طلب شحن لماما</p>
     <button class="btn small full" onclick="go('topup')">فتح</button>
    </div>
    <div class="action-card">
     <h3>🎁 الهدايا</h3>
     <p>أرسل نقاط لأحد أفراد العائلة</p>
     <button class="btn small full" onclick="go('gifts')">فتح</button>
    </div>
    <div class="action-card">
     <h3>🔄 تحويل النقاط</h3>
     <p>حوّل نقاطك إلى رصيد نقدي</p>
     <button class="btn small full" onclick="go('convert')">فتح</button>
    </div>
    <div class="action-card">
     <h3>🛍️ المشتريات</h3>
     <p>سجّل مشترياتك</p>
     <button class="btn small full" onclick="go('purchase')">فتح</button>
    </div>
   </div>
  `}
 </div>

 <div class="card">
  <div class="card-header"><span class="card-title">آخر العمليات</span></div>
  ${ledgerHTML(allLedger.slice(0,5))}
 </div>
 `;
}

/* تحويل النقاط */
function pageConvert(c){
 c.innerHTML=`
 <div class="card">
  <div class="card-header"><span class="card-title">🔄 تحويل النقاط إلى فلوس</span></div>
  <div class="notice">
   كل <b>1000 نقطة = 5 ريالات</b><br>
   أقل تحويل 25 نقطة، والتحويل بمضاعفات 25.
  </div>
  <div class="notice">رصيدك الحالي: <b>${points(currentUser.points)}</b></div>

  <label>اختر عدد النقاط</label>
  <div class="preset-row">
   ${[25,50,100,250,500,1000,2000].map(n=>`
    <button class="preset" onclick="setConvertPoints(${n})">${n.toLocaleString("ar-SA")}</button>
   `).join("")}
  </div>

  <div class="field">
   <label>أو اكتب العدد بنفسك</label>
   <input id="convertPoints" type="number" step="25" min="25" placeholder="مثال: 250">
  </div>
  <div class="notice" id="convertPreview">المبلغ الذي ستحصل عليه: 0.00 ريال</div>
  <button class="btn gold full" onclick="doConvert()">تنفيذ التحويل</button>
 </div>
 `;
 const input=el("convertPoints");
 input.addEventListener("input",updateConvertPreview);
}

function setConvertPoints(value){
 el("convertPoints").value=value;
 updateConvertPreview();
}

function updateConvertPreview(){
 const pts=Number(el("convertPoints")?.value)||0;
 const amount=pts*5/1000;
 const preview=el("convertPreview");
 if(preview)preview.textContent="المبلغ الذي ستحصل عليه: "+amount.toFixed(2)+" ريال";
}

async function doConvert(){
 const pts=Number(el("convertPoints").value);
 if(!Number.isInteger(pts)||pts<25||pts%25!==0){

/* السجل */
function ledgerHTML(list){
 if(!list.length)return '<div class="empty-state">لا توجد عمليات مسجلة</div>';

 return list.map(item=>{
  const date=item.created_at
   ?new Date(item.created_at).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"})
   :"";
  const m=Number(item.amount_change||0);
  const p=Number(item.points_change||0);
  let changeStr="تم تسجيل العملية";
  let cls="";

  if(m!==0){
   changeStr=(m>0?"+":"")+m.toFixed(2)+" ر.س";
   cls=m>0?"plus":"minus";
  }else if(p!==0){
   changeStr=(p>0?"+":"")+p+" نقطة";
   cls=p>0?"plus":"minus";
  }

  return `
  <div class="transaction-row">
   <div class="tx-info">
    <h4>${escapeHTML(item.user_name||"")} · ${escapeHTML(item.description||"عملية")}</h4>
    <span>${date}</span>
   </div>
   <div class="tx-amount ${cls}">${escapeHTML(changeStr)}</div>
  </div>
  `;
 }).join("");
}

/* تنفيذ عمليات ماما */
async function doAdminAdjust(type){
 const targetId=el("admTarget")?.value;
 if(!targetId)return toast("اختاري العضو أولاً");

 const config={
  moneyPlus:{input:"moneyPlusVal",reason:"moneyPlusReason",money:1,points:0,integer:false},
  moneyMinus:{input:"moneyMinusVal",reason:"moneyMinusReason",money:-1,points:0,integer:false},
  pointsPlus:{input:"pointsPlusVal",reason:"pointsPlusReason",money:0,points:1,integer:true},
  pointsMinus:{input:"pointsMinusVal",reason:"pointsMinusReason",money:0,points:-1,integer:true}
 };

 const item=config[type];
 if(!item)return;

 const raw=Number(el(item.input).value);
 const reason=el(item.reason).value.trim();

 if(!Number.isFinite(raw)||raw<=0)return toast("أدخلي قيمة صحيحة");
 if(item.integer&&!Number.isInteger(raw))return toast("عدد النقاط يجب أن يكون رقماً صحيحاً");

 const val=item.integer?raw:Number(raw.toFixed(2));
 const moneyDelta=val*item.money;
 const pointsDelta=val*item.points;

 try{
  await apiRequest({
   action:"adminAdjust",
   targetId,
   moneyDelta,
   pointsDelta,
   reason,
   isReward:false
  });

  await refreshData();
  renderApp();
  toast("تم تنفيذ العملية وتحديث الحساب بنجاح");
 }catch(e){}
}

async function handleTopUp(requestId,status){
 let adminReason="";
 if(status==="rejected"){
  adminReason=prompt("سبب الرفض (اختياري):")||"";
 }

 try{
  await apiRequest({action:"handleTopUp",requestId,status,adminReason});
  await refreshData();
  renderApp();
  toast("تم تحديث طلب الشحن");
 }catch(e){}
}
