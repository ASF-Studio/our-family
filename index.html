<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d34">
<title>بنك العائلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--main:#173d34;--bg:#f4f6f5;--card:#fff;--text:#24332e;--muted:#7b8983;--border:#e5ebe8;--soft:#edf3f0;--red:#b84b4b;--gold:#9a741e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{background:var(--main);color:white;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:18px;font-weight:bold}
.header-user{font-size:12px;color:#d6e4de;margin-top:5px}
.container{max-width:960px;margin:auto;padding:22px 16px 55px}
.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:15px;margin:0 0 12px}
.muted{color:var(--muted);font-size:12px;line-height:1.9}
.login-wrap{max-width:410px;margin:7vh auto;padding:16px}
.login-title{text-align:center;margin-bottom:22px}
.login-title h1{font-size:23px;margin:0 0 8px;color:var(--main)}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--main)}
.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--main);color:white;font-weight:bold;display:block;width:100%;text-align:center;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.light{background:var(--soft);color:var(--main)}
.btn.red{background:#faeeee;color:var(--red)}
.btn.small{padding:8px 12px;font-size:12px;width:auto}
.link-btn{background:none;border:none;color:var(--main);text-decoration:underline;padding:0;font-size:12px;cursor:pointer;margin-top:10px;display:inline-block}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:#f0f4f2;border:1px solid var(--border);border-radius:12px;padding:16px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}
.stat strong{font-size:22px;color:var(--main)}
.stat.points{background:#f8f5eb}
.stat.points strong{color:var(--gold)}
.nav{display:flex;gap:7px;overflow-x:auto;padding:3px 0 14px}
.nav button{white-space:nowrap;border:1px solid var(--border);background:white;color:var(--main);padding:10px 14px;border-radius:9px;font-size:13px}
.nav button.active{background:var(--main);color:white;border-color:var(--main)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-title{font-size:13px;font-weight:bold}
.row-sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.7}
.amount{font-size:13px;font-weight:bold;white-space:nowrap}
.plus{color:#258052}.minus{color:var(--red)}
.notice{background:var(--soft);border-radius:10px;padding:12px;font-size:12px;line-height:1.9;margin:12px 0}
.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}
.profile-chip{background:#ffffff20;border-radius:8px;padding:7px 11px;font-size:12px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#203d34;color:white;padding:12px 18px;border-radius:10px;z-index:99999;max-width:90%;font-size:13px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,0.85);z-index:99998;display:grid;place-items:center;color:var(--main);font-weight:bold;text-align:center}
.spinner{width:32px;height:32px;border:4px solid var(--soft);border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loading" class="loading hidden">
 <div><div class="spinner"></div><div id="loadingText">جاري التحميل...</div></div>
</div>

<header id="header" class="hidden">
 <div>
  <div class="brand">بنك العائلة</div>
  <div class="header-user" id="headerName"></div>
 </div>
 <button class="btn light small" onclick="logout()">خروج</button>
</header>

<!-- شاشة تسجيل الدخول -->
<section id="loginScreen" class="login-wrap">
 <div class="login-title">
  <h1>بنك العائلة</h1>
  <p class="muted">المحفظة العائلية الآمنة</p>
 </div>
 <div class="card" id="loginCard">
  <h2>تسجيل الدخول</h2>
  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="loginEmail" type="email" placeholder="example@domain.com">
  </div>
  <div class="field">
   <label>كلمة المرور</label>
   <input id="loginPassword" type="password" placeholder="أدخل كلمة المرور">
  </div>
  <button type="button" class="btn" onclick="handleLogin()">دخول</button>
  <div style="text-align:center; margin-top:14px;">
   <button type="button" class="link-btn" onclick="toggleAuthMode('signup')">ليس لديك حساب؟ إنشاء حساب جديد</button>
  </div>
 </div>

 <!-- شاشة إنشاء حساب -->
 <div class="card hidden" id="signupCard">
  <h2>إنشاء حساب جديد</h2>
  <div class="field">
   <label>اختر الحساب</label>
   <select id="signupFamilyId">
    <option value="azoz">عزوز</option>
    <option value="sahab">سحاب</option>
    <option value="mama">ماما (الإدارة)</option>
   </select>
  </div>
  <div class="field">
   <label>البريد الإلكتروني</label>
   <input id="signupEmail" type="email" placeholder="بريدك الإلكتروني">
  </div>
  <div class="field">
   <label>كلمة المرور</label>
   <input id="signupPassword" type="password" placeholder="كلمة المرور">
  </div>
  <div class="field">
   <label>رمز الدعوة</label>
   <input id="signupInviteCode" type="text" placeholder="رمز الدعوة الخاص">
  </div>
  <button type="button" class="btn" onclick="handleSignup()">إتمام التسجيل</button>
  <div style="text-align:center; margin-top:14px;">
   <button type="button" class="link-btn" onclick="toggleAuthMode('login')">لديك حساب؟ تسجيل الدخول</button>
  </div>
 </div>
</section>

<!-- لوحة التطبيق -->
<main id="app" class="container hidden">
 <div class="card">
  <div class="topline">
   <div>
    <div class="muted">مرحبًا بك</div>
    <h2 id="welcomeTitle" style="margin:5px 0 0">أهلًا</h2>
   </div>
   <span class="profile-chip" id="roleLabel"></span>
  </div>
 </div>

 <div class="grid" id="statsGrid" style="margin-bottom:16px;">
  <div class="stat"><span>الرصيد المالي</span><strong id="myBalance">0 ر.س</strong></div>
  <div class="stat points"><span>رصيد النقاط</span><strong id="myPoints">0</strong></div>
 </div>

 <div class="card" id="familySummaryCard">
  <h3>أرصدة أفراد العائلة</h3>
  <div id="familySummary"></div>
 </div>

 <div class="nav" id="navigation"></div>
 <section id="pageContent"></section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const SUPABASE_URL = "https://ayfxtomfqrantxmpqgof.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe";
const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/family-api`;

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let allAccounts = [];
let allRecipients = [];
let allLedger = [];
let currentPage = "home";
let isProcessing = false;
let toastTimer;

function el(id){return document.getElementById(id)}
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]))}
function money(value){return (Number(value)||0).toLocaleString("ar-SA",{minimumFractionDigits:0,maximumFractionDigits:2})+" ر.س"}
function points(value){return (Number(value)||0).toLocaleString("ar-SA")}

function showLoading(show, text="جاري التحميل..."){
 const loader = el("loading");
 if(loader) {
  el("loadingText").textContent = text;
  loader.classList.toggle("hidden", !show);
 }
}

function toast(message){
 const t = el("toast");
 if(t) {
  t.textContent = message;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add("hidden"), 3000);
 }
}

function toggleAuthMode(mode) {
 if(mode === 'signup') {
  el("loginCard").classList.add("hidden");
  el("signupCard").classList.remove("hidden");
 } else {
  el("signupCard").classList.add("hidden");
  el("loginCard").classList.remove("hidden");
 }
}

async function apiRequest(payload) {
 showLoading(true);
 try {
  const session = (await supabaseClient.auth.getSession()).data.session;
  const token = session?.access_token || SUPABASE_ANON_KEY;

  const response = await fetch(EDGE_FUNCTION_URL, {
   method: "POST",
   headers: {
    "Content-Type": "application/json",
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${token}`
   },
   body: JSON.stringify(payload)
  });

  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.success) {
   throw new Error(data.error || "تعذر تنفيذ الطلب في الخادم");
  }
  return data;
 } catch (err) {
  toast(err.message || "حدث خطأ غير متوقع");
  throw err;
 } finally {
  showLoading(false);
 }
}

async function handleSignup() {
 if (isProcessing) return;
 const targetFamilyId = el("signupFamilyId").value;
 const email = el("signupEmail").value.trim();
 const password = el("signupPassword").value.trim();
 const inviteCode = el("signupInviteCode").value.trim();

 if(!email || !password || !inviteCode) return toast("يرجى تعبئة كافة الحقول");
 if(password.length < 4) return toast("كلمة المرور يجب ألا تقل عن 4 رموز");

 isProcessing = true;
 showLoading(true, "جاري إنشاء الحساب...");
 try {
  await apiRequest({ action: "signup", email, password, targetFamilyId, inviteCode });
  toast("تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.");
  toggleAuthMode('login');
 } catch(err) {
  // المعالجة عبر apiRequest
 } finally {
  isProcessing = false;
  showLoading(false);
 }
}

async function handleLogin() {
 if (isProcessing) return;
 const email = el("loginEmail").value.trim();
 const password = el("loginPassword").value.trim();

 if(!email || !password) return toast("يرجى إدخال البريد الإلكتروني وكلمة المرور");

 isProcessing = true;
 showLoading(true, "جاري تسجيل الدخول...");

 try {
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error || !data.user) throw new Error(error?.message || "بيانات الدخول غير صحيحة");

  el("loginEmail").value = "";
  el("loginPassword").value = "";

  await refreshData();
  
  el("loginScreen").classList.add("hidden");
  el("header").classList.remove("hidden");
  el("app").classList.remove("hidden");

  currentPage = "home";
  renderApp();
  toast("تم تسجيل الدخول بنجاح");
 } catch (err) {
  toast(err.message);
 } finally {
  isProcessing = false;
  showLoading(false);
 }
}

async function refreshData() {
 try {
  const res = await apiRequest({ action: "getData" });
  currentUser = res.currentUser;
  allAccounts = res.accounts || [];
  allRecipients = res.recipients || [];
  allLedger = res.ledger || [];
 } catch(e) {
  console.error(e);
 }
}

async function restoreSession() {
 const session = (await supabaseClient.auth.getSession()).data.session;
 if (session) {
  await refreshData();
  if (currentUser) {
   el("loginScreen").classList.add("hidden");
   el("header").classList.remove("hidden");
   el("app").classList.remove("hidden");
   renderApp();
  }
 }
}

function renderApp() {
 if (!currentUser) return;
 el("headerName").textContent = currentUser.name || "";
 el("welcomeTitle").textContent = `أهلاً، ${currentUser.name}`;
 el("roleLabel").textContent = currentUser.is_admin ? "مديرة النظام (ماما)" : "عضو في بنك العائلة";

 const statsGrid = el("statsGrid");
 const familyCard = el("familySummaryCard");

 if (currentUser.is_admin) {
  if(statsGrid) statsGrid.classList.add("hidden");
  if(familyCard) familyCard.style.display = "block";
 } else {
  if(statsGrid) statsGrid.classList.remove("hidden");
  if(familyCard) familyCard.style.display = "none";
  el("myBalance").textContent = money(currentUser.balance);
  el("myPoints").textContent = points(currentUser.points);
 }

 renderFamilySummary();
 renderNav();
 renderPage();
}

function renderFamilySummary() {
 const container = el("familySummary");
 if(!container) return;
 if(!currentUser.is_admin) return;
 container.innerHTML = allAccounts.map(acc => `
  <div class="row">
   <div><strong>${escapeHTML(acc.name)}</strong></div>
   <div>
    <span class="amount plus" style="margin-left:8px">${money(acc.balance)}</span>
    <span class="amount" style="color:var(--gold)">${points(acc.points)} نقطة</span>
   </div>
  </div>
 `).join("");
}

function renderNav() {
 const items = currentUser.is_admin
  ? [["home","الرئيسية"],["admin","لوحة الإدارة"],["ledger","السجل"],["settings","الإعدادات"]]
  : [["home","الرئيسية"],["convert","تحويل النقاط"],["gift","إرسال نقاط"],["purchase","المشتريات"],["ledger","السجل"],["settings","الإعدادات"]];
 
 const navEl = el("navigation");
 if(navEl) {
  navEl.innerHTML = items.map(([id,label])=>`<button class="${currentPage===id?"active":""}" onclick="go('${id}')">${label}</button>`).join("");
 }
}

function go(page) {
 currentPage = page;
 renderApp();
}

function renderPage() {
 const pages = {
  home: pageHome,
  convert: pageConvert,
  gift: pageGift,
  purchase: pagePurchase,
  ledger: pageLedger,
  admin: pageAdmin,
  settings: pageSettings
 };
 const container = el("pageContent");
 if(container && pages[currentPage]) {
  pages[currentPage](container);
 }
}

function pageHome(c) {
 c.innerHTML = `<div class="card">
  <h2>الرئيسية</h2>
  <p class="muted">${currentUser.is_admin ? "أهلاً بك يا ماما، يمكنك إدارة أرصدة وحسابات أفراد العائلة." : "كل 1000 نقطة تساوي 5 ريالات."}</p>
  ${currentUser.is_admin ? '<button class="btn" onclick="go(\'admin\')">انتقل إلى لوحة الإدارة</button>' : '<button class="btn" onclick="go(\'convert\')">تحويل النقاط إلى أموال</button>'}
 </div>
 <div class="card">
  <h3>آخر العمليات</h3>
  ${ledgerHTML((allLedger || []).slice(0, 5), false)}
 </div>`;
}

function pageConvert(c) {
 c.innerHTML = `<div class="card">
  <h2>🔄 تحويل النقاط إلى أموال</h2>
  <p class="muted">كل 1000 نقطة = 5 ريالات (الحد الأدنى 25 نقطة ومضاعفاتها)</p>
  <div class="notice">رصيدك الحالي: <b>${points(currentUser.points)} نقطة</b></div>
  <div class="field"><label>عدد النقاط</label><input id="convertAmount" type="number" step="25" min="25" placeholder="مثال: 1000"></div>
  <button class="btn" onclick="doConvertPoints()">تحويل الآن</button>
 </div>`;
}

async function doConvertPoints() {
 const pts = Number(el("convertAmount").value);
 if (!pts || pts < 25 || pts % 25 !== 0) return toast("يجب ألا تقل النقاط عن 25 وأن تكون من مضاعفاتها");
 if (pts > currentUser.points) return toast("رصيد النقاط غير كافٍ");

 await apiRequest({ action: "convertPoints", pointsToConvert: pts });
 await refreshData();
 renderApp();
 toast("تم تحويل النقاط إلى أموال بنجاح!");
}

function pageGift(c) {
 c.innerHTML = `<div class="card">
  <h2>🎁 إرسال نقاط</h2>
  <div class="field"><label>المستلم</label><select id="giftTo">${allRecipients.map(a=>`<option value="${a.id}">${escapeHTML(a.name)}</option>`).join("")}</select></div>
  <div class="field"><label>عدد النقاط (مضاعفات 25)</label><input id="giftPoints" type="number" step="25" min="25" placeholder="عدد النقاط"></div>
  <button class="btn" onclick="doSendPoints()">إرسال النقاط</button>
 </div>`;
}

async function doSendPoints() {
 const toId = el("giftTo").value;
 const pointsVal = Number(el("giftPoints").value);
 if (!pointsVal || pointsVal < 25 || pointsVal % 25 !== 0) return toast("يجب ألا تقل النقاط عن 25 وأن تكون من مضاعفاتها");
 if (pointsVal > currentUser.points) return toast("نقاطك لا تكفي");

 await apiRequest({ action: "sendPoints", toId, points: pointsVal });
 await refreshData();
 renderApp();
 toast("تم إرسال النقاط بنجاح!");
}

function pagePurchase(c) {
 c.innerHTML = `<div class="card">
  <h2>🛒 تسجيل مشتريات (خصم أموال)</h2>
  <div class="field"><label>اسم الغرض</label><input id="purchaseItem" placeholder="مثال: كتاب، لعبة..."></div>
  <div class="field"><label>المبلغ (ريال)</label><input id="purchaseCost" type="number" step="0.5" min="1" placeholder="المبلغ"></div>
  <button class="btn red" onclick="doPurchase()">شراء وخصم المبلغ</button>
 </div>`;
}

async function doPurchase() {
 const item = el("purchaseItem").value.trim();
 const cost = Number(el("purchaseCost").value);
 if (!item || !cost || cost <= 0) return toast("يرجى إدخال اسم الغرض والمبلغ بشكل صحيح");
 if (cost > currentUser.balance) return toast("الرصيد المالي غير كافٍ");

 await apiRequest({ action: "purchase", item, cost });
 await refreshData();
 renderApp();
 toast("تم تسجيل الشراء وخصم المبلغ بنجاح!");
}

function ledgerHTML(list, allowDelete = false) {
 if (!list.length) return `<div class="empty">لا توجد عمليات مسجلة بعد</div>`;
 return list.map(item => {
  const date = new Date(item.created_at).toLocaleString('ar-SA', { dateStyle: 'short', timeStyle: 'short' });
  const m = Number(item.amount_change || 0);
  const p = Number(item.points_change || 0);
  let changeStr = "";
  let cls = "";
  if (m !== 0) {
   changeStr = `${m > 0 ? "+" : ""}${money(m)}`;
   cls = m > 0 ? "plus" : "minus";
  } else if (p !== 0) {
   changeStr = `${p > 0 ? "+" : ""}${points(p)} نقطة`;
   cls = p > 0 ? "plus" : "minus";
  }

  const delBtn = allowDelete && currentUser.is_admin ? `<button class="btn red small" onclick="deleteSingleRecord('${item.id}')">حذف</button>` : "";
  return `<div class="row">
   <div>
    <div class="row-title">${escapeHTML(item.user_name)}: ${escapeHTML(item.description)}</div>
    <div class="row-sub">${date}</div>
    ${delBtn}
   </div>
   <div class="amount ${cls}">${changeStr}</div>
  </div>`;
 }).join("");
}

function pageLedger(c) {
 c.innerHTML = `<div class="card">
  <div class="topline" style="margin-bottom:12px;">
   <h2>📜 سجل العمليات</h2>
   ${currentUser.is_admin ? '<button class="btn red small" onclick="clearLedger()">حذف السجل بالكامل</button>' : ''}
  </div>
  ${ledgerHTML(allLedger, currentUser.is_admin)}
 </div>`;
}

async function deleteSingleRecord(recordId) {
 if (!confirm("هل تريد حذف هذه العملية من السجل؟")) return;
 await apiRequest({ action: "clearLedger", recordId });
 await refreshData();
 renderApp();
 toast("تم الحذف بنجاح");
}

async function clearLedger() {
 if (!confirm("تحذير: سيتم حذف جميع سجلات العمليات، هل أنت متأكد؟")) return;
 await apiRequest({ action: "clearLedger" });
 await refreshData();
 renderApp();
 toast("تم تفريغ السجل بنجاح");
}

function pageAdmin(c) {
 c.innerHTML = `<div class="card">
  <h2>👑 لوحة التحكم والإدارة</h2>
  <div class="field"><label>اختر الحساب المستهدف</label><select id="adminTargetUser">${allAccounts.map(a=>`<option value="${a.id}">${escapeHTML(a.name)}</option>`).join("")}</select></div>
  <div class="field"><label>نوع العملية</label><select id="adminActionType"><option value="moneyPlus">زيادة أموال</option><option value="moneyMinus">خصم أموال</option><option value="pointsPlus">زيادة نقاط</option><option value="pointsMinus">خصم نقاط</option></select></div>
  <div class="field"><label>القيمة (المبلغ أو النقاط)</label><input id="adminValue" type="number" min="1" placeholder="القيمة"></div>
  <div class="field"><label>السبب / الملاحظة</label><input id="adminReason" placeholder="مكافأة تفوق"></div>
  <button class="btn" onclick="doAdminAdjust()">تنفيذ التعديل</button>
 </div>`;
}

async function doAdminAdjust() {
 const targetId = el("adminTargetUser").value;
 const type = el("adminActionType").value;
 const val = Number(el("adminValue").value);
 const reason = el("adminReason").value.trim();

 if (!val || val <= 0) return alert("أدخل قيمة صحيحة");

 let moneyDelta = 0;
 let pointsDelta = 0;

 if (type === 'moneyPlus') moneyDelta = val;
 if (type === 'moneyMinus') moneyDelta = -val;
 if (type === 'pointsPlus') pointsDelta = val;
 if (type === 'pointsMinus') pointsDelta = -val;

 await apiRequest({ action: "adminAdjust", targetId, moneyDelta, pointsDelta, reason });
 await refreshData();
 renderApp();
 toast("تم تنفيذ التعديل الإداري بنجاح!");
}

function pageSettings(c) {
 c.innerHTML = `<div class="card">
  <h2>🔐 تغيير كلمة المرور</h2>
  <div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" placeholder="أدخل كلمة المرور الجديدة"></div>
  <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input id="confirmPassword" type="password" placeholder="أعد إدخال كلمة المرور الجديدة"></div>
  <button class="btn" onclick="doChangePassword()">حفظ كلمة المرور</button>
 </div>`;
}

async function doChangePassword() {
 const newPass = el("newPassword").value.trim();
 const confirmPass = el("confirmPassword").value.trim();

 if (!newPass || !confirmPass) return toast("يرجى تعبئة كافة الحقول");
 if (newPass.length < 4) return toast("كلمة المرور يجب ألا تقل عن 4 رموز");
 if (newPass !== confirmPass) return toast("كلمة المرور وتأكيدها غير متطابقين");

 showLoading(true, "جاري تحديث كلمة المرور...");
 const { error } = await supabaseClient.auth.updateUser({ password: newPass });
 showLoading(false);

 if (error) return toast("تعذر تحديث كلمة المرور: " + error.message);

 el("newPassword").value = "";
 el("confirmPassword").value = "";
 toast("تم تحديث وحفظ كلمة المرور بنجاح!");
}

async function logout() {
 await supabaseClient.auth.signOut();
 currentUser = null;
 allAccounts = [];
 allRecipients = [];
 allLedger = [];
 el("app").classList.add("hidden");
 el("header").classList.add("hidden");
 el("loginScreen").classList.remove("hidden");
}

window.addEventListener('DOMContentLoaded', restoreSession);
</script>
</body>
