
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183d35">
<title>عائلتنا الجميلة</title>
<style>
:root{
--main:#183d35;--main2:#24584b;--soft:#e9f1ee;
--bg:#f3f6f5;--card:#fff;--text:#1e302b;
--muted:#81918b;--border:#e5ece8;--red:#c34c4c;
--gold:#d69c32;--shadow:0 8px 28px #183d3510
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Tahoma,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{background:var(--main);color:white;padding:18px 5%;
display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:19px;font-weight:bold}
.header-user{font-size:13px;color:#dce9e4}
.container{max-width:1050px;margin:auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);
border-radius:19px;padding:19px;margin-bottom:15px;box-shadow:var(--shadow)}
h2,h3{margin-top:0}
h2{font-size:21px}
h3{font-size:16px}
.muted{color:var(--muted);font-size:13px;line-height:1.8}
.login-wrap{max-width:420px;margin:9vh auto;padding:18px}
.logo{text-align:center;margin-bottom:25px}
.logo-icon{width:65px;height:65px;border-radius:21px;
background:var(--main);color:white;display:grid;place-items:center;
font-size:27px;margin:auto auto 12px}
.logo h1{font-size:23px;margin:0 0 7px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;padding:13px;border:1px solid var(--border);
border-radius:12px;background:#fff;outline:none;color:var(--text)}
input:focus,select:focus{border-color:var(--main2)}
.btn{border:0;border-radius:12px;padding:12px 17px;
background:var(--main);color:white;font-weight:bold}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.light{background:var(--soft);color:var(--main)}
.btn.red{background:#fae9e9;color:var(--red)}
.btn.gold{background:#fff3d9;color:#946313}
.btn.full{width:100%}
.btn.small{padding:8px 12px;font-size:12px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.stat{background:var(--soft);border-radius:15px;padding:16px}
.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}
.stat strong{font-size:23px;color:var(--main)}
.stat.money{background:#e8f3ed}
.stat.points{background:#fff4dd}
.stat.points strong{color:#986c16}
.nav{display:flex;gap:8px;overflow:auto;padding:4px 0 15px}
.nav button{white-space:nowrap;border:1px solid var(--border);
background:white;color:var(--main);padding:10px 14px;border-radius:12px}
.nav button.active{background:var(--main);color:white}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;
padding:13px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row-title{font-weight:bold;font-size:14px}
.row-sub{font-size:12px;color:var(--muted);margin-top:5px}
.amount{font-weight:bold;white-space:nowrap}
.plus{color:#26845b}.minus{color:var(--red)}
.notice{background:#f0f5f2;border-radius:12px;padding:12px;
font-size:13px;line-height:1.8;margin-bottom:10px}
.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);
background:#203d34;color:white;padding:13px 20px;border-radius:13px;
z-index:20;box-shadow:var(--shadow);max-width:90%;font-size:13px}
.loading{position:fixed;inset:0;background:#ffffffc9;z-index:30;
display:grid;place-items:center;font-weight:bold;color:var(--main)}
.spinner{width:35px;height:35px;border:4px solid var(--soft);
border-top-color:var(--main);border-radius:50%;
animation:spin .8s linear infinite;margin:auto auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.profile-chip{background:#ffffff20;border-radius:20px;padding:8px 12px}
hr{border:0;border-top:1px solid var(--border);margin:17px 0}
@media(max-width:600px){
header{padding:15px}.container{padding:15px 12px 45px}
.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:19px}
.card{padding:15px}.login-wrap{margin:5vh auto}
}
</style>
</head>
<body>

<div id="loading" class="loading hidden">
 <div><div class="spinner"></div><div id="loadingText">جاري التحميل...</div></div>
</div>

<header id="header" class="hidden">
 <div>
  <div class="brand">🌿 عائلتنا الجميلة</div>
  <div class="header-user" id="headerName"></div>
 </div>
 <button class="btn light small" onclick="logout()">خروج</button>
</header>

<section id="loginScreen" class="login-wrap">
 <div class="logo">
  <div class="logo-icon">🌿</div>
  <h1>عائلتنا الجميلة</h1>
  <p class="muted">محفظتنا العائلية ومكافآتنا</p>
 </div>
 <div class="card">
  <h2>تسجيل الدخول</h2>
  <div class="field">
   <label>اختر الحساب</label>
   <select id="loginAccount">
    <option value="azoz">عزوز</option>
    <option value="sahab">سحاب</option>
    <option value="mama">ماما - الإدارة</option>
   </select>
  </div>
  <div class="field">
   <label>الرقم السري</label>
   <input id="loginPin" type="password" inputmode="numeric"
   maxlength="12" placeholder="أدخل الرقم السري">
  </div>
  <button class="btn full" onclick="login()">دخول</button>
  <p class="muted" style="text-align:center">أهلًا بكم في عائلتنا ❤️</p>
 </div>
</section>

<main id="app" class="container hidden">
 <div class="card">
  <div class="topline">
   <div>
    <div class="muted">مرحبًا بك</div>
    <h2 id="welcomeName" style="margin:5px 0">أهلًا</h2>
   </div>
   <span class="profile-chip" id="roleLabel"></span>
  </div>
 </div>

 <div id="memberArea">
  <div class="grid">
   <div class="stat money">
    <span>💵 رصيدك المالي</span>
    <strong id="moneyValue">0 ر.س</strong>
   </div>
   <div class="stat points">
    <span>⭐ نقاطك</span>
    <strong id="pointsValue">0</strong>
   </div>
  </div>
 </div>

 <div id="adminArea" class="hidden">
  <div class="grid" id="adminStats"></div>
 </div>

 <div class="nav" id="navigation"></div>
 <section id="pageContent"></section>
</main>

<div id="toast" class="toast hidden"></div>

<script>
const API_URL="https://ayfxtomfqrantxmpqgof.supabase.co/functions/v1/family-api";
const API_KEY="sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe";

let token="";
let currentUser=null;
let appData={};
let currentPage="home";
let adminTarget="azoz";

const names={azoz:"عزوز",sahab:"سحاب",mama:"ماما"};

function el(id){return document.getElementById(id)}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function money(value){
 return (Number(value)||0).toLocaleString("ar-SA",{maximumFractionDigits:2})+" ر.س";
}
function points(value){
 return (Number(value)||0).toLocaleString("ar-SA");
}
function showLoading(show,text="جاري التحميل..."){
 el("loadingText").textContent=text;
 el("loading").classList.toggle("hidden",!show);
}
let toastTimer;
function toast(message){
 el("toast").textContent=message;
 el("toast").classList.remove("hidden");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el("toast").classList.add("hidden"),3000);
}
function isAdmin(){
 return currentUser?.id==="mama"&&currentUser?.role==="admin";
}
async function api(action,data={}){
 const headers={
  "Content-Type":"application/json",
  "apikey":API_KEY
 };
 if(token)headers.Authorization="Bearer "+token;
 const res=await fetch(API_URL,{
  method:"POST",headers,
  body:JSON.stringify({action,...data})
 });
 let result={};
 try{result=await res.json()}catch{}
 if(!res.ok||result.error)throw new Error(result.error||"تعذر تنفيذ الطلب");
 return result;
}

async function login(){
 const account_id=el("loginAccount").value;
 const pin=el("loginPin").value.trim();
 if(!pin)return toast("أدخل الرقم السري");
 showLoading(true,"جاري تسجيل الدخول...");
 try{
  const result=await api("login",{account_id,pin});
  token=result.token;
  currentUser=result.profile;
  await loadData();
  el("loginScreen").classList.add("hidden");
  el("header").classList.remove("hidden");
  el("app").classList.remove("hidden");
  renderApp();
  toast("تم تسجيل الدخول بنجاح");
 }catch(e){toast(e.message)}
 finally{showLoading(false)}
}

async function loadData(target){
 showLoading(true);
 try{
  const data=await api("get",target?{account_id:target}:{});
  appData=data;
  if(isAdmin()&&target)adminTarget=target;
  return data;
 }finally{showLoading(false)}
}

async function refresh(){
 try{
  await loadData(isAdmin()&&currentPage==="account"?adminTarget:null);
  renderApp();
 }catch(e){toast(e.message)}
}

function logout(){
 token="";
 currentUser=null;
 appData={};
 localStorage.removeItem("family_token");
 el("app").classList.add("hidden");
 el("header").classList.add("hidden");
 el("loginScreen").classList.remove("hidden");
 el("loginPin").value="";
}

function renderApp(){
 el("headerName").textContent=currentUser.display_name||names[currentUser.id];
 el("welcomeName").textContent=currentUser.display_name||names[currentUser.id];
 el("roleLabel").textContent=isAdmin()?"لوحة الإدارة":"عضو العائلة";
 el("memberArea").classList.toggle("hidden",isAdmin());
 el("adminArea").classList.toggle("hidden",!isAdmin());

 if(isAdmin()){
  const balances=appData.allBalances||[];
  el("adminStats").innerHTML=balances.map(b=>`
   <div class="stat">
    <span>${escapeHTML(names[b.account_id]||b.account_id)}</span>
    <strong>${money(b.money)}</strong>
    <div class="muted">${points(b.points)} نقطة</div>
   </div>`).join("");
 }else{
  el("moneyValue").textContent=money(appData.balance?.money);
  el("pointsValue").textContent=points(appData.balance?.points);
 }
 renderNav();
 renderPage();
}

function renderNav(){
 let items=isAdmin()
 ?[["home","الرئيسية"],["account","حسابات العائلة"],["adjust","تعديل الأرصدة"],["reward","إرسال مكافأة"],["notifications","الإشعارات"],["settings","الإعدادات"]]
 :[["home","الرئيسية"],["convert","تحويل النقاط"],["gift","إرسال هدية"],["rewards","مكافآتي"],["purchase","المشتريات"],["ledger","السجل"],["notifications","الإشعارات"],["settings","الإعدادات"]];
 el("navigation").innerHTML=items.map(([id,label])=>
 `<button class="${currentPage===id?"active":""}" onclick="go('${id}')">${label}</button>`
 ).join("");
}

async function go(page){
 currentPage=page;
 if(isAdmin()&&page==="account"){
  await loadData(adminTarget);
 }else{
  await loadData();
 }
 renderApp();
}

function renderPage(){
 const content=el("pageContent");
 if(currentPage==="home")return pageHome(content);
 if(currentPage==="convert")return pageConvert(content);
 if(currentPage==="gift")return pageGift(content);
 if(currentPage==="rewards")return pageRewards(content);
 if(currentPage==="purchase")return pagePurchase(content);
 if(currentPage==="ledger")return pageLedger(content);
 if(currentPage==="notifications")return pageNotifications(content);
 if(currentPage==="settings")return pageSettings(content);
 if(currentPage==="account")return pageAccount(content);
 if(currentPage==="adjust")return pageAdjust(content);
 if(currentPage==="reward")return pageAdminReward(content);
 pageHome(content);
}

function pageHome(content){
 content.innerHTML=`
 <div class="card">
  <h2>الرئيسية 🌿</h2>
  <p class="muted">${isAdmin()?"من هنا تقدرين تديرين أرصدة العائلة ومكافآتهم.":"تابع رصيدك ونقاطك واستمتع بالمكافآت."}</p>
  ${isAdmin()?`
   <div class="notice">حساب ماما إداري فقط، وما له رصيد مالي أو نقاط.</div>
   <button class="btn" onclick="go('account')">إدارة حسابات العائلة</button>
  `:`
   <div class="notice">كل 1000 نقطة تساوي 5 ريالات عند تحويلها إلى بطاقة استرداد.</div>
   <div class="actions">
    <button class="btn" onclick="go('convert')">تحويل نقاطي</button>
    <button class="btn light" onclick="go('rewards')">مكافآتي</button>
   </div>
  `}
 </div>
 <div class="card">
  <h3>آخر العمليات</h3>
  ${ledgerHTML((appData.ledger||[]).slice(0,5))}
 </div>`;
}

function pageConvert(content){
 const balance=Number(appData.balance?.points)||0;
 content.innerHTML=`
 <div class="card">
  <h2>تحويل النقاط ⭐</h2>
  <p class="muted">كل 1000 نقطة = 5 ريالات. يتم خصم النقاط عند إصدار البطاقة.</p>
  <div class="notice">رصيدك الحالي: <b>${points(balance)} نقطة</b></div>
  <div class="field"><label>عدد النقاط</label>
   <input id="convertPoints" type="number" min="1000" step="1000" placeholder="مثال: 1000">
  </div>
  <div class="grid">
   ${[1000,2000,5000].map(n=>`<button class="btn light" onclick="el('convertPoints').value=${n}">${points(n)} نقطة</button>`).join("")}
  </div>
  <p id="convertValue" class="muted"></p>
  <button class="btn full" onclick="convertPoints()">إصدار بطاقة الاسترداد</button>
 </div>`;
 el("convertPoints").addEventListener("input",()=>{
  const n=Number(el("convertPoints").value);
  el("convertValue").textContent=n>0&&n%1000===0?`قيمة البطاقة: ${money(n/1000*5)}`:"";
 });
}
async function convertPoints(){
 const n=Number(el("convertPoints").value);
 if(!Number.isSafeInteger(n)||n<1000||n%1000!==0)return toast("النقاط لازم تكون من مضاعفات 1000");
 if(n>Number(appData.balance.points))return toast("رصيد النقاط ما يكفي");
 await runAction("convert",{points:n},"تم إصدار بطاقة الاسترداد");
}

function pageGift(content){
 content.innerHTML=`
 <div class="card">
  <h2>إرسال هدية 🎁</h2>
  <p class="muted">أرسل نقاط من رصيدك إلى فرد من العائلة.</p>
  <div class="field"><label>إلى</label>
   <select id="giftTo">
    ${CHILDREN.filter(id=>id!==currentUser.id).map(id=>`<option value="${id}">${names[id]}</option>`).join("")}
   </select>
  </div>
  <div class="field"><label>عدد النقاط</label>
   <input id="giftPoints" type="number" min="1" step="1" placeholder="عدد النقاط">
  </div>
  <div class="field"><label>رسالة (اختياري)</label>
   <input id="giftMessage" maxlength="200" placeholder="اكتب رسالة جميلة">
  </div>
  <button class="btn full" onclick="sendGift()">إرسال الهدية</button>
 </div>`;
}
async function sendGift(){
 const to=el("giftTo").value;
 const n=Number(el("giftPoints").value);
 if(!Number.isSafeInteger(n)||n<=0)return toast("أدخل عدد نقاط صحيح");
 if(n>Number(appData.balance.points))return toast("رصيد النقاط ما يكفي");
 await runAction("gift",{
  to,points:n,message:el("giftMessage").value
 },"تم إرسال الهدية");
}

function pageRewards(content){
 const list=appData.rewards||[];
 content.innerHTML=`
 <div class="card">
  <h2>مكافآتي 🎁</h2>
  ${list.length?list.map(r=>`
   <div class="row">
    <div>
     <div class="row-title">${escapeHTML(r.title)}</div>
     <div class="row-sub">${escapeHTML(r.message||"")} · ${r.unit==="points"?points(r.amount)+" نقطة":money(r.amount)}</div>
     <div class="row-sub">${r.status==="redeemed"?"تم الاسترداد":"متاحة للاسترداد"}</div>
    </div>
    ${r.status==="pending"?`<button class="btn small" onclick="redeem('${r.id}')">استرداد</button>`:"<span class='muted'>مكتملة</span>"}
   </div>`).join(""):`<div class="empty">ما عندك مكافآت حاليًا</div>`}
 </div>`;
}
async function redeem(id){
 await runAction("redeem",{reward_id:id},"تم استرداد المكافأة");
}

function pagePurchase(content){
 content.innerHTML=`
 <div class="card">
  <h2>المشتريات 🛍️</h2>
  <p class="muted">تسجيل عملية شراء وخصم قيمتها من رصيدك.</p>
  <div class="field"><label>القسم</label>
   <select id="purchaseCategory">
    <option>مشتريات</option><option>ألعاب</option>
    <option>أكل</option><option>أخرى</option>
   </select>
  </div>
  <div class="field"><label>اسم المنتج</label>
   <input id="purchaseItem" placeholder="اسم المنتج">
  </div>
  <div class="field"><label>السعر بالريال</label>
   <input id="purchaseAmount" type="number" min=".01" step=".01" placeholder="0.00">
  </div>
  <button class="btn full" onclick="purchase()">تأكيد الشراء</button>
 </div>`;
}
async function purchase(){
 const amount=Number(el("purchaseAmount").value);
 const item=el("purchaseItem").value.trim();
 if(!item)return toast("اكتب اسم المنتج");
 if(!Number.isFinite(amount)||amount<=0)return toast("أدخل سعر صحيح");
 if(amount>Number(appData.balance.money))return toast("رصيدك المالي ما يكفي");
 await runAction("purchase",{
  category:el("purchaseCategory").value,item,amount
 },"تم تسجيل عملية الشراء");
}

function ledgerHTML(list){
 if(!list.length)return `<div class="empty">ما فيه عمليات مسجلة</div>`;
 return list.map(x=>{
  const m=Number(x.money_change)||0,p=Number(x.points_change)||0;
  const value=m?`${m>0?"+":""}${money(m)}`:
  `${p>0?"+":""}${points(p)} نقطة`;
  const cls=(m||p)>=0?"plus":"minus";
  return `<div class="row">
   <div><div class="row-title">${escapeHTML(x.title||"عملية")}</div>
   <div class="row-sub">${escapeHTML(x.details||"")}</div>
   <div class="row-sub">${x.created_at?new Date(x.created_at).toLocaleString("ar-SA"):""}</div></div>
   <div class="amount ${cls}">${value}</div>
  </div>`;
 }).join("");
}
function pageLedger(content){
 content.innerHTML=`<div class="card"><h2>سجل العمليات</h2>${ledgerHTML(appData.ledger||[])}</div>`;
}

function pageNotifications(content){
 const list=appData.notifications||[];
 content.innerHTML=`
 <div class="card">
  <h2>الإشعارات 🔔</h2>
  ${list.length?list.map(n=>`
   <div class="notice">
    <b>${escapeHTML(n.title)}</b>
    <div>${escapeHTML(n.message)}</div>
    <div class="muted">${n.created_at?new Date(n.created_at).toLocaleString("ar-SA"):""}</div>
    ${isAdmin()?`<button class="btn red small" onclick="deleteNotification('${n.id}')">حذف</button>`:""}
   </div>`).join(""):`<div class="empty">ما عندك إشعارات</div>`}
 </div>`;
}
async function deleteNotification(id){
 await runAction("delete_notification",{id},"تم حذف الإشعار");
}

function pageSettings(content){
 content.innerHTML=`
 <div class="card">
  <h2>الإعدادات ⚙️</h2>
  <div class="field"><label>الاسم الظاهر</label>
   <input id="settingName" maxlength="30" value="${escapeHTML(currentUser.display_name||"")}">
  </div>
  <div class="field"><label>لون التطبيق</label>
   <input id="settingColor" type="color" value="${/^#[0-9a-fA-F]{6}$/.test(currentUser.theme_color||"")?currentUser.theme_color:"#183d35"}">
  </div>
  <button class="btn full" onclick="saveSettings()">حفظ الإعدادات</button>
  <hr>
  <h3>تغيير الرقم السري</h3>
  <div class="field"><label>الرقم الحالي</label><input id="oldPin" type="password" inputmode="numeric"></div>
  <div class="field"><label>الرقم الجديد</label><input id="newPin" type="password" inputmode="numeric" maxlength="12"></div>
  <button class="btn light full" onclick="changePin()">تغيير الرقم السري</button>
 </div>`;
}
async function saveSettings(){
 const display_name=el("settingName").value.trim();
 const theme_color=el("settingColor").value;
 if(!display_name)return toast("اكتب الاسم");
 try{
  await api("settings",{display_name,theme_color});
  currentUser.display_name=display_name;
  currentUser.theme_color=theme_color;
  document.documentElement.style.setProperty("--main",theme_color);
  toast("تم حفظ الإعدادات");
  renderApp();
 }catch(e){toast(e.message)}
}
async function changePin(){
 const old_pin=el("oldPin").value;
 const new_pin=el("newPin").value;
 if(!/^[0-9]{4,12}$/.test(new_pin))return toast("الرقم الجديد لازم يكون من 4 إلى 12 رقم");
 await runAction("change_pin",{old_pin,new_pin},"تم تغيير الرقم السري");
}

function pageAccount(content){
 const accounts=appData.accounts||[];
 const balances=appData.allBalances||[];
 const selected=adminTarget;
 const b=balances.find(x=>x.account_id===selected)||{};
 content.innerHTML=`
 <div class="card">
  <h2>حسابات العائلة</h2>
  <div class="field"><label>اختاري الحساب</label>
   <select id="adminTargetSelect" onchange="selectAdminTarget(this.value)">
    ${CHILDREN.map(id=>`<option value="${id}" ${id===selected?"selected":""}>${names[id]}</option>`).join("")}
   </select>
  </div>
  <div class="grid">
   <div class="stat money"><span>الرصيد المالي</span><strong>${money(b.money)}</strong></div>
   <div class="stat points"><span>النقاط</span><strong>${points(b.points)}</strong></div>
  </div>
  <div class="actions">
   <button class="btn" onclick="go('adjust')">تعديل الرصيد</button>
   <button class="btn light" onclick="go('reward')">إرسال مكافأة</button>
  </div>
  <hr>
  <h3>حالة الحساب</h3>
  <p class="muted">${accounts.find(a=>a.id===selected)?.blocked?"الحساب موقوف":"الحساب نشط"}</p>
  <button class="btn red" onclick="toggleBlock('${selected}',${!accounts.find(a=>a.id===selected)?.blocked})">
   ${accounts.find(a=>a.id===selected)?.blocked?"تفعيل الحساب":"إيقاف الحساب"}
  </button>
 </div>
 <div class="card"><h3>سجل ${names[selected]}</h3>${ledgerHTML(appData.ledger||[])}</div>`;
}
async function selectAdminTarget(id){
 adminTarget=id;
 await loadData(id);
 renderApp();
}
async function toggleBlock(id,blocked){
 await runAction("toggle_block",{account_id:id,blocked},"تم تحديث حالة الحساب");
}

function pageAdjust(content){
 content.innerHTML=`
 <div class="card">
  <h2>تعديل الأرصدة</h2>
  <div class="field"><label>الحساب</label>
   <select id="adjustAccount">${CHILDREN.map(id=>`<option value="${id}" ${id===adminTarget?"selected":""}>${names[id]}</option>`).join("")}</select>
  </div>
  <div class="field"><label>نوع الرصيد</label>
   <select id="adjustUnit"><option value="money">فلوس (ريال)</option><option value="points">نقاط</option></select>
  </div>
  <div class="field"><label>القيمة</label>
   <input id="adjustAmount" type="number" step="any" placeholder="استخدم السالب للخصم">
  </div>
  <div class="field"><label>السبب</label><input id="adjustReason" maxlength="200" placeholder="سبب التعديل"></div>
  <button class="btn full" onclick="adjustBalance()">حفظ التعديل</button>
 </div>`;
}
async function adjustBalance(){
 const account_id=el("adjustAccount").value;
 const unit=el("adjustUnit").value;
 const amount=Number(el("adjustAmount").value);
 if(!Number.isFinite(amount)||amount===0)return toast("أدخل قيمة صحيحة");
 if(unit==="points"&&!Number.isSafeInteger(amount))return toast("النقاط لازم تكون عددًا صحيحًا");
 await runAction("admin_adjust",{
  account_id,unit,amount,reason:el("adjustReason").value
 },"تم تعديل الرصيد");
}

function pageAdminReward(content){
 content.innerHTML=`
 <div class="card">
  <h2>إرسال مكافأة 🎁</h2>
  <div class="field"><label>إلى الحساب</label>
   <select id="rewardAccount">${CHILDREN.map(id=>`<option value="${id}" ${id===adminTarget?"selected":""}>${names[id]}</option>`).join("")}</select>
  </div>
  <div class="field"><label>اسم المكافأة</label><input id="rewardTitle" maxlength="100" placeholder="مكافأة جميلة"></div>
  <div class="field"><label>رسالة</label><input id="rewardMessage" maxlength="200" placeholder="رسالة المكافأة"></div>
  <div class="field"><label>نوع المكافأة</label>
   <select id="rewardUnit"><option value="points">نقاط</option><option value="money">ريالات</option></select>
  </div>
  <div class="field"><label>الكمية</label><input id="rewardAmount" type="number" min="1" step="any"></div>
  <button class="btn full" onclick="sendAdminReward()">إرسال المكافأة</button>
 </div>`;
}
async function sendAdminReward(){
 const account_id=el("rewardAccount").value;
 const unit=el("rewardUnit").value;
 const amount=Number(el("rewardAmount").value);
 if(!Number.isFinite(amount)||amount<=0)return toast("أدخل كمية صحيحة");
 if(unit==="points"&&!Number.isSafeInteger(amount))return toast("النقاط لازم تكون عددًا صحيحًا");
 await runAction("admin_reward",{
  account_id,title:el("rewardTitle").value,
  message:el("rewardMessage").value,unit,amount
 },"تم إرسال المكافأة");
}

async function runAction(action,data,message){
 showLoading(true,"جاري تنفيذ العملية...");
 try{
  await api(action,data);
  toast(message);
  await loadData(isAdmin()&&currentPage==="account"?adminTarget:null);
  renderApp();
 }catch(e){toast(e.message)}
 finally{showLoading(false)}
}

// استعادة الجلسة بعد تحديث الصفحة
async function restoreSession(){
 const saved=localStorage.getItem("family_token");
 if(!saved)return;
 token=saved;
 // لا يوجد endpoint لاستعادة الحساب من التوكن في هذا الإصدار؛
 // لذلك نطلب تسجيل الدخول من جديد عند تحديث الصفحة.
 token="";
 localStorage.removeItem("family_token");
}
restoreSession();
</script>
</body>
</html>
