
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2b22">
<title>بنك العائلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
--primary:#0d2b22;
--primary-light:#154536;
--gold:#c5a059;
--gold-light:#e6c584;
--bg:#f4f7f6;
--card:#fff;
--text:#1a2e26;
--muted:#5a6e67;
--border:#e2e8e5;
--red:#a93226;
--green:#1e8449;
--shadow:0 10px 25px -5px rgba(13,43,34,.08)
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
display:flex;flex-direction:column;min-height:100vh;font-size:16px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
background:linear-gradient(135deg,var(--primary),var(--primary-light));
color:white;padding:18px 6%;display:flex;align-items:center;
justify-content:space-between;gap:12px;flex-wrap:wrap;
box-shadow:0 4px 20px rgba(0,0,0,.12)
}
.bank-brand{display:flex;align-items:center;gap:12px}
.bank-title{font-size:20px;font-weight:bold}
.bank-subtitle{font-size:13px;color:var(--gold-light)}
.container{max-width:1050px;margin:auto;padding:28px 16px 60px;flex:1;width:100%}
.auth-container{max-width:440px;margin:9vh auto;padding:16px}
.auth-card{
background:var(--card);border-radius:20px;padding:36px;
box-shadow:var(--shadow);border:1.5px solid var(--border)
}
.auth-logo-area{text-align:center;margin-bottom:28px}
.auth-logo-area h1{font-size:26px;margin:0 0 8px;color:var(--primary)}
.auth-logo-area p{font-size:14px;color:var(--muted);margin:0}
.field{margin:18px 0}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input,select,textarea{
width:100%;padding:14px 16px;border:1.5px solid var(--border);
border-radius:12px;background:#fff;color:var(--text);font-size:15px
}
input:focus,select:focus,textarea:focus{
border-color:var(--primary);outline:none;
box-shadow:0 0 0 3px rgba(13,43,34,.08)
}
.btn{
border:0;border-radius:12px;padding:15px 20px;background:var(--primary);
color:white;font-weight:600;font-size:15px;display:inline-block;
text-align:center;transition:.2s;box-shadow:0 4px 12px rgba(13,43,34,.15)
}
.btn:hover{background:var(--primary-light)}
.btn.gold{background:var(--gold);color:var(--primary)}
.btn.gold:hover{background:var(--gold-light)}
.btn.red{background:var(--red);color:white}
.btn.small{padding:9px 14px;font-size:13px}
.btn.outline{background:transparent;border:1.5px solid rgba(255,255,255,.4);color:white}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.full{width:100%}
.bank-card-hero{
background:linear-gradient(135deg,#0d2b22,#1f4d3e);
color:white;border-radius:18px;padding:28px;
box-shadow:0 15px 30px rgba(13,43,34,.18);margin-bottom:24px
}
.bank-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.bank-card-chip{
width:40px;height:30px;
background:linear-gradient(135deg,#e6c584,#c5a059);border-radius:6px
}
.bank-card-balances{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.balance-item span{display:block;font-size:13px;color:#a3b8b1;margin-bottom:6px}
.balance-item strong{font-size:26px;font-weight:700}
.eye-icon{
background:rgba(255,255,255,.15);border:0;color:white;
width:32px;height:32px;border-radius:50%;margin-right:6px
}
.nav-tabs{
display:flex;gap:8px;overflow-x:auto;padding:4px 0 20px;
scrollbar-width:none
}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{
white-space:nowrap;border:1.5px solid var(--border);
background:white;color:var(--text);padding:11px 18px;
border-radius:10px;font-size:14px;font-weight:600
}
.nav-tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.card{
background:var(--card);border:1.5px solid var(--border);
border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)
}
.card-header{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)
}
.card-title{font-size:17px;font-weight:700;color:var(--primary)}
.transaction-row{
display:flex;justify-content:space-between;align-items:center;
gap:12px;padding:14px 0;border-bottom:1px solid #f0f4f2
}
.transaction-row:last-child{border-bottom:0}
.tx-info{min-width:0;overflow-wrap:anywhere}
.tx-info h4{margin:0 0 4px;font-size:15px;font-weight:600}
.tx-info span{font-size:13px;color:var(--muted);line-height:1.7}
.tx-amount{font-size:15px;font-weight:700;white-space:nowrap}
.tx-amount.plus{color:var(--green)}
.tx-amount.minus{color:var(--red)}
.notice{
background:#f0f4f2;border-radius:12px;padding:14px;
font-size:14px;line-height:1.7;margin:12px 0;
border-right:4px solid var(--primary)
}
.empty-state{text-align:center;padding:32px;color:var(--muted);font-size:14px}
.products-grid{
display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:14px;margin-top:16px
}
.product-card{
border:1.5px solid var(--border);border-radius:14px;
padding:18px;text-align:center;background:#fff
}
.product-card h4{margin:0 0 8px;font-size:16px;color:var(--primary)}
.product-card p{font-size:15px;font-weight:700;color:var(--gold);margin:0 0 14px}
.hint-text{font-size:12px;color:var(--muted);margin-top:6px;display:block}
.coin-anim{position:relative}
@keyframes coinFly{
0%{transform:translateY(0) scale(1);opacity:1}
50%{transform:translateY(-40px) scale(1.2)}
100%{transform:translateY(-80px) scale(.8);opacity:0}
}
.coin-anim.active:after{
content:"🪙 +💰";position:absolute;right:50%;top:-10px;
animation:coinFly 1s ease-out forwards;font-size:20px;pointer-events:none
}
footer{
background:#0d2b22;color:#a3b8b1;text-align:center;
padding:18px;font-size:12px;margin-top:auto
}
.toast{
position:fixed;bottom:24px;right:50%;transform:translateX(50%);
background:#0d2b22;color:white;padding:13px 22px;border-radius:12px;
z-index:99999;max-width:90%;font-size:14px;
box-shadow:0 8px 20px rgba(0,0,0,.2)
}
.loading-overlay{
position:fixed;inset:0;background:rgba(255,255,255,.88);
z-index:99998;display:grid;place-items:center;
color:var(--primary);font-weight:bold
}
.spinner{
width:36px;height:36px;border:3.5px solid var(--border);
border-top-color:var(--primary);border-radius:50%;
animation:spin .8s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
.status-pill{
display:inline-block;padding:5px 10px;border-radius:20px;
font-size:12px;background:#f0f4f2;color:var(--primary)
}
.status-pill.pending{background:#fff4d8;color:#8a6200}
.status-pill.approved{background:#e5f5eb;color:var(--green)}
.status-pill.rejected{background:#fbe9e7;color:var(--red)}
@media(max-width:600px){
header{padding:15px}
.container{padding:18px 12px 40px}
.auth-card{padding:25px}
.bank-card-hero{padding:22px}
.balance-item strong{font-size:20px}
.card{padding:17px}
.transaction-row{align-items:flex-start}
}
</style>
</head>

<body>

<div id="loading" class="loading-overlay hidden">
<div>
<div class="spinner"></div>
<div id="loadingText">جاري المعالجة...</div>
</div>
</div>

<header id="header" class="hidden">
<div class="bank-brand">
<div>
<div class="bank-title">بنك العائلة</div>
<div class="bank-subtitle" id="headerRoleLabel">الحساب الفردي</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:12px">
<span id="headerName" style="font-size:14px;font-weight:600"></span>
<button class="btn outline small" onclick="logout()">تسجيل الخروج</button>
</div>
</header>

<section id="loginScreen" class="auth-container">
<div class="auth-card">
<div class="auth-logo-area">
<h1>بنك العائلة</h1>
<p>تسجيل الدخول الآمن للحسابات العائلية</p>
</div>

<form id="loginForm" onsubmit="handleLoginSubmit(event)">
<div class="field">
<label>اختر الحساب</label>
<select id="loginFamilyId">
<option value="azoz">عزوز</option>
<option value="sahab">سحاب</option>
<option value="mama">ماما (لوحة الإدارة)</option>
</select>
</div>

<div class="field">
<label>الرمز السري</label>
<input id="loginPin" type="password" maxlength="8"
inputmode="numeric" autocomplete="current-password"
placeholder="أدخل الرمز السري" required>
</div>

<button type="submit" id="loginBtn" class="btn gold full" style="margin-top:20px">
تسجيل الدخول
</button>
</form>
</div>
</section>

<main id="app" class="container hidden">

<div class="bank-card-hero" id="bankHeroCard">
<div class="bank-card-top">
<div class="bank-card-chip"></div>
<span id="cardHolderName" style="font-size:13px;color:#e2e8e5">FAMILY BANK</span>
</div>

<div class="bank-card-balances">
<div class="balance-item">
<span>رصيد النقاط
<button class="eye-icon" onclick="toggleHide('points')">👁</button>
</span>
<strong id="myPoints" style="color:var(--gold-light)">0 نقطة</strong>
</div>

<div class="balance-item">
<span>الرصيد النقدي
<button class="eye-icon" onclick="toggleHide('balance')">👁</button>
</span>
<strong id="myBalance">0.00 ر.س</strong>
</div>
</div>
</div>

<div class="card" id="familySummaryCard" style="display:none">
<div class="card-header">
<span class="card-title">نظرة عامة على حسابات العائلة</span>
</div>
<div id="familySummary"></div>
</div>

<div class="nav-tabs" id="navigation"></div>
<section id="pageContent"></section>
</main>

<footer>جميع الحقوق محفوظة لبنك العائلة ©</footer>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";

/* إعدادات الاتصال */
const SUPABASE_URL = "https://cursiwpgzaisednzpjsi.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hZ653h1LL_jnaHMLRw1-ng_vsSyQs57";
const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/family-api`;

/* بيانات التطبيق */
let currentUser = null;
let sessionToken = localStorage.getItem("family_bank_session") || "";

let allAccounts = [];
let allRecipients = [];
let allLedger = [];
let allTopUps = [];
let allGifts = [];
let allNotifications = [];

let currentPage = "home";
let isProcessing = false;
let toastTimer;
let hideBalance = false;
let hidePoints = false;

function el(id){
return document.getElementById(id);
}

function escapeHTML(value){
return String(value ?? "").replace(/[&<>"']/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function money(value){
if(hideBalance) return "••••••";
return (Number(value)||0).toLocaleString("ar-SA",{
minimumFractionDigits:2,
maximumFractionDigits:2
})+" ر.س";
}

function points(value){
if(hidePoints) return "••••";
return (Number(value)||0).toLocaleString("ar-SA")+" نقطة";
}

function showLoading(show,text="جاري المعالجة..."){
const loader=el("loading");
if(!loader)return;
el("loadingText").textContent=text;
loader.classList.toggle("hidden",!show);
}

function toast(message){
const t=el("toast");
if(!t)return;
t.textContent=message;
t.classList.remove("hidden");
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>t.classList.add("hidden"),4000);
}

function toggleHide(type){
if(type==="balance")hideBalance=!hideBalance;
if(type==="points")hidePoints=!hidePoints;
renderApp();
}

/* الاتصال بالسيرفر */
async function apiRequest(payload){
showLoading(true);
try{
const headers={
"Content-Type":"application/json",
"apikey":SUPABASE_ANON_KEY
};

if(sessionToken){
headers["Authorization"]="Bearer "+sessionToken;
}

const response=await fetch(EDGE_FUNCTION_URL,{
method:"POST",
headers,
body:JSON.stringify(payload)
});

const data=await response.json().catch(()=>({}));

if(!response.ok || !data.success){
if(response.status===401){
sessionToken="";
localStorage.removeItem("family_bank_session");
}
throw new Error(data.error || "تعذر الاتصال بالخادم");
}

return data;
}catch(err){
console.error("API Error:",err);
toast(err.message || "خطأ في الاتصال");
throw err;
}finally{
showLoading(false);
}
}

/* تسجيل الدخول */
async function handleLoginSubmit(event){
event.preventDefault();
if(isProcessing)return;

const familyId=el("loginFamilyId").value;
const pin=el("loginPin").value.trim();
const btn=el("loginBtn");

if(!pin)return toast("اكتب الرقم السري");

isProcessing=true;
btn.disabled=true;
btn.textContent="جاري التحقق...";

try{
const response=await fetch(EDGE_FUNCTION_URL,{
method:"POST",
headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_ANON_KEY
},
body:JSON.stringify({action:"login",familyId,pin})
});

const data=await response.json().catch(()=>({}));

if(!response.ok || !data.success){
throw new Error(data.error || "بيانات الدخول غير صحيحة");
}

if(!data.sessionToken){
throw new Error("السيرفر لم يرجع رمز الجلسة");
}

sessionToken=data.sessionToken;
localStorage.setItem("family_bank_session",sessionToken);

currentUser=data.currentUser;
el("loginPin").value="";

await refreshData();

el("loginScreen").classList.add("hidden");
el("header").classList.remove("hidden");
el("app").classList.remove("hidden");

currentPage="home";
renderApp();
toast("مرحباً بك يا "+currentUser.name);

}catch(err){
console.error(err);
toast(err.message || "فشل تسجيل الدخول");
currentUser=null;
sessionToken="";
localStorage.removeItem("family_bank_session");
}finally{
isProcessing=false;
btn.disabled=false;
btn.textContent="تسجيل الدخول";
}
}

/* تحميل بيانات الحساب */
async function refreshData(){
const res=await apiRequest({action:"getData"});

if(res.currentUser){
currentUser=res.currentUser;
}

allAccounts=res.accounts || [];
allRecipients=res.recipients || [];
allLedger=res.ledger || [];
allTopUps=res.topUps || [];
allGifts=res.gifts || [];
allNotifications=res.notifications || [];

return res;
}

/* استعادة الجلسة */
async function restoreSession(){
if(!sessionToken)return;

try{
showLoading(true,"جاري استعادة الجلسة...");
await refreshData();

if(!currentUser || currentUser.blocked){
logout();
toast("الحساب غير متاح");
return;
}

el("loginScreen").classList.add("hidden");
el("header").classList.remove("hidden");
el("app").classList.remove("hidden");

currentPage="home";
renderApp();

}catch(err){
console.error("Restore:",err);
sessionToken="";
localStorage.removeItem("family_bank_session");
toast("سجل الدخول من جديد");
}finally{
showLoading(false);
}
}

/* عرض التطبيق */
function renderApp(){
if(!currentUser)return;

el("headerName").textContent=currentUser.name || "";
el("cardHolderName").textContent=(currentUser.name || "FAMILY").toUpperCase()+" / FAMILY BANK";

el("headerRoleLabel").textContent=currentUser.is_admin
?"لوحة الإدارة (ماما)"
:"الحساب الفردي";

const familyCard=el("familySummaryCard");
const heroCard=el("bankHeroCard");

if(currentUser.is_admin){
heroCard.style.display="none";
familyCard.style.display="block";
}else{
heroCard.style.display="block";
familyCard.style.display="none";
el("myBalance").textContent=money(currentUser.balance);
el("myPoints").textContent=points(currentUser.points);
}

renderFamilySummary();
renderNav();
renderPage();
}

function renderFamilySummary(){
const container=el("familySummary");
if(!container || !currentUser.is_admin)return;

container.innerHTML=allAccounts.map(acc=>`
<div class="transaction-row">
<div class="tx-info">
<h4>${escapeHTML(acc.name)}</h4>
<span>الحالة:
<b style="color:${acc.blocked?'var(--red)':'var(--green)'}">
${acc.blocked?"موقوف":"نشط"}
</b>
</span>
</div>
<div style="text-align:left">
<div style="font-weight:700;color:var(--primary)">${money(acc.balance)}</div>
<div style="font-size:12px;color:var(--gold)">${points(acc.points)}</div>
</div>
</div>
`).join("") || `<div class="empty-state">لا توجد حسابات</div>`;
}

function renderNav(){
const items=currentUser.is_admin
?[
["home","الرئيسية"],
["admin","الإدارة والعمليات"],
["ledger","السجل"],
["notifications","التنبيهات"],
["settings","الإعدادات"]
]
:[
["home","الرئيسية"],
["convert","تحويل النقاط"],
["topup","شحن الرصيد"],
["gifts","الهدايا"],
["purchase","المشتريات"],
["ledger","السجل"],
["notifications","التنبيهات"],
["settings","الإعدادات"]
];

el("navigation").innerHTML=items.map(([id,label])=>`
<button class="nav-tab ${currentPage===id?"active":""}"
onclick="go('${id}')">${label}</button>
`).join("");
}

function go(page){
currentPage=page;
renderApp();
}

function renderPage(){
const pages={
home:pageHome,
convert:pageConvert,
topup:pageTopUp,
gifts:pageGifts,
purchase:pagePurchase,
ledger:pageLedger,
notifications:pageNotifications,
admin:pageAdmin,
settings:pageSettings
};

const container=el("pageContent");
if(container && pages[currentPage]){
pages[currentPage](container);
}
}

/* الرئيسية */
function pageHome(c){
c.innerHTML=`
<div class="card" style="border-right:4px solid var(--gold)">
<div class="card-header">
<span class="card-title">🌟 حسابي العائلي</span>
</div>
<p style="line-height:1.8;color:var(--muted)">
${currentUser.is_admin
?"أهلاً بك يا ماما. من هنا يمكنك إدارة حسابات وأرصدة العائلة."
:"أهلاً بك. استعرض رصيدك، وحوّل نقاطك، واستخدم المشتريات."}
</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
${currentUser.is_admin
?`<button class="btn gold" onclick="go('admin')">إدارة الأرصدة والطلبات</button>`
:`<button class="btn gold" onclick="go('convert')">تحويل النقاط</button>
<button class="btn" onclick="go('purchase')">المشتريات</button>`}
</div>
</div>

<div class="card">
<div class="card-header">
<span class="card-title">آخر العمليات</span>
</div>
${ledgerHTML(allLedger.slice(0,5))}
</div>
`;
}

/* تحويل النقاط */
function pageConvert(c){
const available=Number(currentUser.points||0);
const maxRiyals=Math.floor(available/5000)*25;

c.innerHTML=`
<div class="card">
<div class="card-header">
<span class="card-title">تحويل النقاط إلى رصيد</span>
</div>

<div class="notice">
كل 1000 نقطة تساوي 5 ريالات.
<br>
رصيد نقاطك: <b>${points(available)}</b>
</div>

<p style="color:var(--muted);line-height:1.8;font-size:14px">
اختر مبلغ التحويل بالريال. الحد الأدنى 25 ريالًا، ويجب أن يكون المبلغ من مضاعفات 25.
</p>

<div class="field">
<label>المبلغ المراد تحويله بالريال</label>
<input id="convertAmount" type="number" min="25" step="25"
placeholder="مثال: 25 أو 50" oninput="updateConvertPreview()">
<span class="hint-text" id="convertPreview">النقاط المطلوبة: 0</span>
</div>

<button id="convertBtn" class="btn gold full coin-anim" onclick="doConvert()">
تحويل النقاط
</button>
</div>
`;
}

function updateConvertPreview(){
const amount=Number(el("convertAmount").value)||0;
const needed=amount*200;
el("convertPreview").textContent=
"النقاط المطلوبة: "+needed.toLocaleString("ar-SA")+" نقطة";
}

async function doConvert(){
if(isProcessing)return;

const amount=Number(el("convertAmount").value);
const needed=amount*200;

if(!amount || amount<25 || amount%25!==0){
return toast("الحد الأدنى 25 ريالًا، ويجب أن يكون من مضاعفات 25");
}

if(needed>Number(currentUser.points||0)){
return toast("نقاطك لا تكفي للتحويل");
}

if(!confirm(`تأكيد تحويل ${needed} نقطة إلى ${amount} ريال؟`))return;

isProcessing=true;
const btn=el("convertBtn");
btn.disabled=true;
btn.classList.add("active");

try{
await apiRequest({
action:"convertPoints",
amount:amount
});

await refreshData();
renderApp();
toast("تم تحويل النقاط بنجاح");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
if(btn)btn.disabled=false;
}
}

/* طلب الشحن */
function pageTopUp(c){
c.innerHTML=`
<div class="card">
<div class="card-header">
<span class="card-title">طلب شحن الرصيد</span>
</div>

<p style="color:var(--muted);line-height:1.8">
أرسل طلب الشحن لماما، وسيتم تحديث رصيدك بعد الموافقة.
</p>

<div class="field">
<label>المبلغ بالريال</label>
<input id="topUpAmountRaw" type="number" min="0.01" step="0.01"
placeholder="مثال: 50 أو 50000">
<span id="topUpFormatted" class="hint-text">المبلغ: 0.00 ر.س</span>
</div>

<div class="field">
<label>ملاحظة (اختياري)</label>
<input id="topUpNote" maxlength="250" placeholder="تفاصيل الطلب">
</div>

<button class="btn gold full" onclick="doRequestTopUp()">إرسال طلب الشحن</button>
</div>

<div class="card">
<div class="card-header">
<span class="card-title">سجل طلبات الشحن</span>
</div>
${topUpHTML(allTopUps)}
</div>
`;

el("topUpAmountRaw").addEventListener("input",()=>{
const raw=Number(el("topUpAmountRaw").value)||0;
const amount=raw>=1000?raw/1000:raw;
el("topUpFormatted").textContent="المبلغ المحسوب: "+amount.toFixed(2)+" ر.س";
});
}

function getMoneyInput(raw){
const value=Number(raw)||0;
return value>=1000?value/1000:value;
}

async function doRequestTopUp(){
if(isProcessing)return;

try{
const amount=getMoneyInput(el("topUpAmountRaw").value);
const note=el("topUpNote").value.trim();

if(!amount || amount<=0)return toast("أدخل مبلغًا صحيحًا");

isProcessing=true;
await apiRequest({action:"requestTopUp",amount,note});
await refreshData();
renderApp();
toast("تم إرسال طلب الشحن لماما");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

function topUpHTML(list){
if(!list.length)return `<div class="empty-state">لا توجد طلبات شحن سابقة</div>`;

const statusMap={
pending:"قيد المراجعة",
approved:"تمت الموافقة",
rejected:"مرفوض"
};

return list.map(item=>`
<div class="transaction-row">
<div class="tx-info">
<h4>طلب شحن بقيمة ${money(item.amount)}</h4>
<span>
ملاحظة: ${escapeHTML(item.note||"بدون")}
<br>
الحالة:
<span class="status-pill ${escapeHTML(item.status)}">
${statusMap[item.status]||escapeHTML(item.status)}
</span>
${item.admin_reason?`<br>السبب: ${escapeHTML(item.admin_reason)}`:""}
</span>
</div>
<div class="tx-amount">
${item.created_at?new Date(item.created_at).toLocaleDateString("ar-SA"):""}
</div>
</div>
`).join("");
}

async function doSendGift(){
if(isProcessing)return;

try{
const receiverId=el("giftTo").value;
const giftPoints=Number(el("giftPoints").value);
const message=el("giftMessage").value.trim();

if(!receiverId)return toast("اختر المستلم");
if(!giftPoints || giftPoints<=0)return toast("أدخل عدد نقاط صحيح");
if(giftPoints>Number(currentUser.points||0))return toast("نقاطك لا تكفي");

if(!confirm(`هل تريد إرسال ${giftPoints} نقطة؟`))return;

isProcessing=true;

await apiRequest({
action:"sendGift",
receiverId,
points:giftPoints,
message
});

await refreshData();
renderApp();
toast("تم إرسال الهدية بنجاح");

}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

function giftsHTML(list){
if(!list.length)return `<div class="empty-state">لا توجد هدايا مسجلة</div>`;

return list.map(item=>`
<div class="transaction-row">
<div class="tx-info">
<h4>من ${escapeHTML(item.sender_name||"")} إلى ${escapeHTML(item.receiver_name||"")}</h4>
<span>${escapeHTML(item.message||"بدون رسالة")}</span>
</div>
<div class="tx-amount" style="color:var(--gold)">
${points(item.points)}
</div>
</div>
`).join("");
}

async function doPurchase(index){
const products=[
{name:"وجبة سريعة / غداء",price:35},
{name:"قهوة ومشروب بارد",price:18},
{name:"كتاب / أداة مدرسية",price:45},
{name:"ترفيه",price:100},
{name:"وجبة خفيفة / سناك",price:10},
{name:"طلب خاص",price:25}
];

const product=products[index];
if(!product)return;

if(product.price>Number(currentUser.balance||0)){
return toast("رصيدك لا يكفي للشراء");
}

if(!confirm(`تأكيد شراء ${product.name} بسعر ${product.price} ريال؟`))return;

if(isProcessing)return;
isProcessing=true;

try{
await apiRequest({
action:"purchase",
product:product.name,
cost:product.price
});

await refreshData();
renderApp();
toast("تم الشراء بنجاح");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

/* السجل */
function ledgerHTML(list){
if(!list.length)return `<div class="empty-state">لا توجد عمليات مسجلة</div>`;

return list.map(item=>{
const date=item.created_at
?new Date(item.created_at).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"})
:"";

const m=Number(item.amount_change||0);
const p=Number(item.points_change||0);

let changeStr="";
let cls="";

if(m!==0){
changeStr=(m>0?"+":"")+money(m);
cls=m>0?"plus":"minus";
}else if(p!==0){
changeStr=(p>0?"+":"")+points(p);
cls=p>0?"plus":"minus";
}

return `
<div class="transaction-row">
<div class="tx-info">
<h4>${escapeHTML(item.user_name||"")} : ${escapeHTML(item.description||"عملية")}</h4>
<span>${date}</span>
</div>
<div class="tx-amount ${cls}">${changeStr}</div>
</div>
`;
}).join("");
}

function pageLedger(c){
c.innerHTML=`
<div class="card">
<div class="card-header">
<span class="card-title">📜 سجل العمليات</span>
</div>
${ledgerHTML(allLedger)}
</div>
`;
}

async function doChangePin(){
const newPin=el("newPinInput").value.trim();

if(!/^\d{4,8}$/.test(newPin)){
return toast("الرقم السري يجب أن يكون من 4 إلى 8 أرقام");
}

try{
await apiRequest({action:"changePin",newPin});
el("newPinInput").value="";
toast("تم تغيير الرقم السري بنجاح");
}catch(e){
console.error(e);
}
}

}

c.innerHTML=`

</div>

<div class="field">

<select id="admTarget">

function updateAdminPreview(){
const type=el("admType").value;
const raw=Number(el("admValRaw").value)||0;
const isMoney=type.includes("money");
const value=isMoney?getMoneyInput(raw):raw;

el("admFormatted").textContent=isMoney
?"القيمة المحسوبة: "+value.toFixed(2)+" ر.س"
:"القيمة: "+value+" نقطة";
}

async function confirmAdminAdjust(){
const targetId=el("admTarget").value;
const type=el("admType").value;
const raw=Number(el("admValRaw").value);
const isMoney=type.includes("money");
const val=isMoney?getMoneyInput(raw):raw;
const reason=el("admReason").value.trim();

const target=allAccounts.find(a=>a.id===targetId);
if(!target)return toast("اختر حسابًا");

if(!val || val<=0)return toast("أدخل قيمة صحيحة");

if(!isMoney && !Number.isInteger(val)){
return toast("النقاط يجب أن تكون عددًا صحيحًا");
}

if(type==="moneyMinus" && val>Number(target.balance||0)){
return toast("الرصيد لا يكفي للخصم");
}

if(type==="pointsMinus" && val>Number(target.points||0)){
return toast("النقاط لا تكفي للخصم");
}

if(!confirm(`تأكيد العملية على ${target.name} بقيمة ${val}؟`))return;

if(isProcessing)return;
isProcessing=true;

try{
await apiRequest({action:"adminAdjust",targetId,type,val,reason});
await refreshData();
renderApp();
toast("تم تنفيذ العملية بنجاح");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

/* الموافقة على طلبات الشحن */
async function handleTopUp(requestId,status){
let adminReason="";

if(status==="rejected"){
adminReason=prompt("اكتب سبب الرفض (اختياري):")||"";
}

if(!confirm(status==="approved"?"تأكيد قبول طلب الشحن؟":"تأكيد رفض طلب الشحن؟"))return;

if(isProcessing)return;
isProcessing=true;

try{
await apiRequest({
action:"handleTopUp",
requestId,
status,
adminReason
});

await refreshData();
renderApp();
toast("تم تحديث طلب الشحن");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

/* إيقاف وتفعيل الحساب */
async function doToggleBlock(){
const targetId=el("blockTarget").value;
const blocked=el("blockStatus").value==="true";

if(!targetId)return toast("اختر حسابًا");
if(!confirm(blocked?"تأكيد إيقاف الحساب؟":"تأكيد إعادة تفعيل الحساب؟"))return;

if(isProcessing)return;
isProcessing=true;

try{
await apiRequest({action:"toggleBlock",targetId,blocked});
await refreshData();
renderApp();
toast(blocked?"تم إيقاف الحساب":"تم تفعيل الحساب");
}catch(e){
console.error(e);
}finally{
isProcessing=false;
}
}

/* تسجيل الخروج */
function logout(){
currentUser=null;
sessionToken="";
localStorage.removeItem("family_bank_session");

allAccounts=[];
allRecipients=[];
allLedger=[];
allTopUps=[];
allGifts=[];
allNotifications=[];

el("app").classList.add("hidden");
el("header").classList.add("hidden");
el("loginScreen").classList.remove("hidden");
el("loginPin").value="";
currentPage="home";
}

window.addEventListener("DOMContentLoaded",restoreSession);
</script>
