
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بنك العائلة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#fff;font-family:Arial,sans-serif}
main{max-width:850px;margin:auto;padding:20px}
.card{background:#1c293d;padding:20px;border-radius:18px;margin:14px 0}
h1,h2{color:#7ee0c1}
input,button,select{width:100%;padding:13px;border:0;border-radius:10px;margin:7px 0;font-size:16px}
input,select{background:#101827;color:white;border:1px solid #43536c}
button{background:#39bd9a;color:#071b18;font-weight:bold;cursor:pointer}
button.secondary{background:#34445e;color:white}
.hidden{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{font-size:13px}
.stat{font-size:25px;font-weight:bold}
small{color:#b9c7d9}
</style>
</head>
<body>
<main>
<h1>🏦 بنك العائلة</h1>

<section id="login" class="card">
<h2>تسجيل الدخول</h2>
<input id="username" placeholder="اسم المستخدم">
<input id="pin" type="password" inputmode="numeric" placeholder="رقم PIN">
<button onclick="login()">دخول</button>
<p id="loginError"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2 id="welcome"></h2>
<p>رصيدك</p>
<div class="stat" id="balance">0</div>
<p>نقاطك</p>
<div class="stat" id="points">0</div>
<button class="secondary" onclick="refresh()">تحديث البيانات</button>
<button class="secondary" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="tabs">
<button onclick="tab('convert')">تحويل</button>
<button onclick="tab('gift')">هدايا</button>
<button onclick="tab('history')">السجل</button>
<button onclick="tab('admin')">الإدارة</button>
</div>

<div id="convert" class="card hidden">
<h2>تحويل النقاط</h2>
<small>كل 1000 نقطة = 5 ريال</small>
<input id="convertPoints" type="number" placeholder="عدد النقاط">
<button onclick="convertPoints()">تحويل</button>
</div>

<div id="gift" class="card hidden">
<h2>إرسال هدية</h2>
<select id="receiver">
<option value="azooz">عزوز</option>
<option value="sahab">سحاب</option>
</select>
<input id="giftPoints" type="number" placeholder="عدد النقاط">
<input id="giftMessage" placeholder="رسالة الهدية">
<button onclick="sendGift()">إرسال</button>
</div>

<div id="history" class="card hidden">
<h2>سجل العمليات</h2>
<div id="historyList"></div>
</div>

<div id="admin" class="card hidden">
<h2>لوحة الإدارة</h2>
<input id="target" placeholder="اسم الحساب">
<input id="adjustBalance" type="number" placeholder="تغيير الرصيد">
<input id="adjustPoints" type="number" placeholder="تغيير النقاط">
<button onclick="adminAdjust()">تنفيذ التعديل</button>
<input id="blockTarget" placeholder="اسم الحساب للإيقاف">
<button onclick="toggleBlock(true)">إيقاف حساب</button>
<button class="secondary" onclick="toggleBlock(false)">تفعيل حساب</button>
</div>

<p id="message"></p>
</section>
</main>

<script>
const API = "https://cursiwpgzaisednzpjsi.supabase.co/functions/v1/family-api";

// ضع Publishable key الخاص بنفس مشروع Supabase هنا:
const PUBLIC_KEY = "PUT_YOUR_PROJECT_PUBLISHABLE_KEY_HERE";

let token = "";
let account = null;

async function api(action, data={}) {
  const response = await fetch(API, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":PUBLIC_KEY
    },
    body:JSON.stringify({action,...data,token})
  });

  const result = await response.json();
  if (!response.ok || result.error) throw new Error(result.error || "Request failed");
  return result;
}

function message(text) {
  document.getElementById("message").textContent = text;
}

async function login() {
  const username = document.getElementById("username").value.trim().toLowerCase();
  const pin = document.getElementById("pin").value.trim();

  try {
    const result = await api("login",{username,pin});
    token = result.token;
    account = result.account;
    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    await refresh();
  } catch(e) {
    document.getElementById("loginError").textContent = e.message;
  }
}

async function refresh() {
  try {
    const result = await api("getData");
    const me = result.account;

    document.getElementById("welcome").textContent = "أهلًا " + me.display_name;
    document.getElementById("balance").textContent = Number(me.balance).toFixed(2) + " ريال";
    document.getElementById("points").textContent = me.points + " نقطة";

    document.getElementById("admin").style.display =
      me.role === "admin" ? "" : "none";

    document.getElementById("historyList").innerHTML =
      result.ledger.map(x =>
        `<div class="card"><b>${escapeHTML(x.description)}</b><br>
        <small>${new Date(x.created_at).toLocaleString("ar-SA")}</small>
        <p>الرصيد: ${x.amount_change} | النقاط: ${x.points_change}</p></div>`
      ).join("") || "ما فيه عمليات";

  } catch(e) {
    message(e.message);
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function tab(id) {
  ["convert","gift","history","admin"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

async function convertPoints() {
  try {
    await api("convertPoints",{
      points:Number(document.getElementById("convertPoints").value)
    });
    message("تم التحويل");
    await refresh();
  } catch(e) { message(e.message); }
}

async function sendGift() {
  try {
    await api("sendGift",{
      receiver:document.getElementById("receiver").value,
      points:Number(document.getElementById("giftPoints").value),
      message:document.getElementById("giftMessage").value
    });
    message("تم إرسال الهدية");
    await refresh();
  } catch(e) { message(e.message); }
}

async function adminAdjust() {
  try {
    await api("adminAdjust",{
      username:document.getElementById("target").value,
      balance:Number(document.getElementById("adjustBalance").value || 0),
      points:Number(document.getElementById("adjustPoints").value || 0)
    });
    message("تم التعديل");
    await refresh();
  } catch(e) { message(e.message); }
}

async function toggleBlock(blocked) {
  try {
    await api("toggleBlock",{
      username:document.getElementById("blockTarget").value,
      blocked
    });
    message("تم تحديث حالة الحساب");
  } catch(e) { message(e.message); }
}

function logout() {
  token = "";
  account = null;
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("pin").value = "";
}

</script>
</body>
</html>
