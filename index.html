
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#103b2d">
<title>بنك العائلة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#183328;font-family:Arial,sans-serif}
header{background:#103b2d;color:white;padding:18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:850px;margin:25px auto;padding:12px}
.card{background:white;border:1px solid #e1e9e4;border-radius:15px;padding:20px;margin-bottom:15px}
h2{margin:0 0 15px;font-size:20px}
input,select{width:100%;padding:13px;border:1px solid #dce5df;border-radius:9px;margin:7px 0 15px;font-size:16px}
button{border:0;border-radius:9px;padding:12px 17px;background:#103b2d;color:white;font-weight:bold;cursor:pointer}
.gold{background:#c9a45d;color:#173426}.red{background:#a93226}
.full{width:100%}.muted{color:#718078;font-size:13px;line-height:1.8}
.hidden{display:none!important}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.nav button{white-space:nowrap;background:white;color:#103b2d;border:1px solid #dce5df}
.nav button.active{background:#103b2d;color:white}
.hero{background:#103b2d;color:white;border-radius:15px;padding:20px;margin-bottom:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}
.stats strong{display:block;font-size:23px;margin-top:7px}
.row{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #edf1ee}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.product{border:1px solid #e1e9e4;border-radius:12px;padding:15px;text-align:center}
.option{background:#eef3ef;color:#103b2d;border:1px solid #dce5df;margin:4px}
.notice{background:#f1f5f1;padding:12px;border-radius:9px;font-size:14px;line-height:1.8}
#message{padding:12px;border-radius:9px;background:#fff2e8;color:#963d1c;margin-top:12px;display:none;line-height:1.7}
</style>
</head>
<body>

<header id="header" class="hidden">
  <b>🏦 بنك العائلة</b>
  <button onclick="logout()">خروج</button>
</header>

<main>
<section id="login">
  <div class="card" style="max-width:430px;margin:9vh auto">
    <h2 style="text-align:center">🏦 بنك العائلة</h2>
    <p class="muted" style="text-align:center">سجّل دخولك لحسابك</p>
    <label>الحساب</label>
    <select id="familyId">
      <option value="azoz">عزوز</option>
      <option value="sahab">سحاب</option>
      <option value="mama">المدير</option>
    </select>
    <label>الرقم السري</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="الرقم السري">
    <button class="full gold" id="loginBtn" onclick="login()">دخول</button>
    <div id="message"></div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="hero" id="hero">
    <b id="welcome"></b>
    <div class="stats">
      <div>النقاط<strong id="points">0</strong></div>
      <div>الرصيد<strong id="balance">0.00 ر.س</strong></div>
    </div>
  </div>
  <div id="adminSummary" class="card hidden"></div>
  <nav class="nav" id="nav"></nav>
  <div id="page"></div>
</section>
</main>

<script>
"use strict";

const API="https://cursiwpgzaisednzpjsi.supabase.co/functions/v1/family-api";
const APIKEY="sb_publishable_hZ653h1LL_jnaHMLRw1-ng_vsSyQs57";
const $=id=>document.getElementById(id);

let token="",me=null,accounts=[],recipients=[],ledger=[],gifts=[],currentPage="home",busy=false;

function showMessage(msg){
  $("message").style.display="block";
  $("message").textContent=msg;
}

function money(v){
  return (Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" ر.س";
}
function fmt(v){return (Number(v)||0).toLocaleString("en-US")}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function request(data,session=true){
  const headers={"Content-Type":"application/json","apikey":APIKEY};
  if(session&&token)headers.Authorization="Bearer "+token;

  let response;
  try{
    response=await fetch(API,{
      method:"POST",
      headers,
      body:JSON.stringify(data),
      cache:"no-store"
    });
  }catch(e){
    throw new Error("تعذر الاتصال بالسيرفر. تأكد من الإنترنت ونشر Edge Function.");
  }

  let result;
  try{result=await response.json();}
  catch(e){throw new Error("السيرفر رجّع استجابة غير مفهومة. راجع نشر Edge Function.");}

  if(!response.ok||result.success===false){
    if(response.status===401&&session){
      token="";
      localStorage.removeItem("family_bank_session");
    }
    throw new Error(result.error||("خطأ في السيرفر: "+response.status));
  }
  return result;
}

async function login(){
  if(busy)return;
  busy=true;
  $("loginBtn").disabled=true;
  $("message").style.display="none";

  try{
    const familyId=$("familyId").value;
    const pin=$("pin").value.trim();
    if(!pin)throw new Error("اكتب الرقم السري.");

    const result=await request({action:"login",familyId,pin},false);
    if(!result.sessionToken)throw new Error("السيرفر لم يرجع رمز الدخول.");

    token=result.sessionToken;
    localStorage.setItem("family_bank_session",token);
    me=result.currentUser;
    $("pin").value="";
    await loadData();
    enterApp();
  }catch(e){
    showMessage(e.message);
  }finally{
    busy=false;
    $("loginBtn").disabled=false;
  }
}

async function loadData(){
  const d=await request({action:"getData"});
  me=d.currentUser||me;
  accounts=d.accounts||[];
  recipients=d.recipients||[];
  ledger=d.ledger||[];
  gifts=d.gifts||[];
}

async function restore(){
  token=localStorage.getItem("family_bank_session")||"";
  if(!token)return;
  try{
    await loadData();
    enterApp();
  }catch(e){
    token="";
    localStorage.removeItem("family_bank_session");
    $("login").classList.remove("hidden");
    showMessage("انتهت الجلسة أو تعذر استرجاعها. سجّل دخولك من جديد.");
  }
}

function enterApp(){
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("header").classList.remove("hidden");
  render();
}

function logout(){
  token="";
  me=null;
  localStorage.removeItem("family_bank_session");
  $("app").classList.add("hidden");
  $("header").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function toast(msg){alert(msg);}

async function run(fn){
  if(busy)return;
  busy=true;
  try{await fn();}
  catch(e){toast(e.message);}
  finally{busy=false;}
}

async function refresh(){
  await loadData();
  render();
}

function go(p){currentPage=p;render();}

function render(){
  if(!me)return;

  $("welcome").textContent="أهلًا "+(me.name||"");
  $("hero").classList.toggle("hidden",!!me.is_admin);
  $("adminSummary").classList.toggle("hidden",!me.is_admin);

  if(!me.is_admin){
    $("points").textContent=fmt(me.points)+" نقطة";
    $("balance").textContent=money(me.balance);
  }else{
    $("adminSummary").innerHTML="<h2>حسابات العائلة</h2>"+accounts.filter(a=>!a.is_admin).map(a=>
      `<div class="row"><b>${esc(a.name)}</b><span>${money(a.balance)}<br>${fmt(a.points)} نقطة</span></div>`
    ).join("");
  }

  const tabs=me.is_admin
    ?[["home","الرئيسية"],["admin","الإدارة"],["ledger","السجل"],["settings","الإعدادات"]]
    :[["home","الرئيسية"],["convert","تحويل النقاط"],["gifts","الهدايا"],["purchase","المشتريات"],["ledger","السجل"],["settings","الإعدادات"]];

  $("nav").innerHTML=tabs.map(([id,label])=>
    `<button class="${currentPage===id?"active":""}" onclick="go('${id}')">${label}</button>`
  ).join("");

  const pages={home:homePage,convert:convertPage,gifts:giftsPage,purchase:purchasePage,ledger:ledgerPage,admin:adminPage,settings:settingsPage};
  (pages[currentPage]||homePage)();
}

function homePage(){
  $("page").innerHTML=`
    <div class="card"><h2>🌟 الرئيسية</h2>
    <p class="muted">${me.is_admin?"مرحبًا بك في لوحة إدارة بنك العائلة.":"تابع نقاطك ورصيدك واستخدم خدمات الحساب."}</p></div>
    <div class="card"><h2>آخر العمليات</h2>${ledgerHTML(ledger.slice(0,5))}</div>`;
}

function convertPage(){
  const choices=[25,50,100,250,500,1000,2500,5000,10000];
  $("page").innerHTML=`
    <div class="card"><h2>🪙 تحويل النقاط</h2>
    <div class="notice">كل 1000 نقطة = 5 ريالات. أقل تحويل 25 نقطة. يتم تقريب الناتج لأقرب هللة.</div>
    <div class="grid" style="margin-top:15px">
    ${choices.map(n=>`<button class="option" ${n>Number(me.points)?"disabled":""} onclick="convert(${n})">${fmt(n)} نقطة</button>`).join("")}
    </div></div>`;
}

async function convert(points){
  const amount=Math.round(points*.5)/100;
  if(!confirm(`تحويل ${fmt(points)} نقطة إلى ${money(amount)}؟`))return;
  await run(async()=>{
    await request({action:"convertPoints",points});
    await refresh();
    toast("تم التحويل");
  });
}

function giftsPage(){
  $("page").innerHTML=`
    <div class="card"><h2>🎁 إرسال هدية نقاط</h2>
    <label>المستلم</label>
    <select id="giftTo">${recipients.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</select>
    <label>النقاط</label><input id="giftPoints" type="number" min="1" step="1">
    <label>رسالة اختيارية</label><input id="giftMessage" maxlength="250">
    <button class="full gold" onclick="sendGift()">إرسال</button></div>
    <div class="card"><h2>الهدايا السابقة</h2>
    ${gifts.map(g=>`<div class="row"><span>${esc(g.sender_name)} ← ${esc(g.receiver_name)}</span><b>${fmt(g.points)} نقطة</b></div>`).join("")||"لا توجد هدايا."}</div>`;
}

async function sendGift(){
  const receiverId=$("giftTo").value;
  const points=Number($("giftPoints").value);
  if(!Number.isSafeInteger(points)||points<=0)return toast("أدخل عدد نقاط صحيح");
  if(!confirm("تأكيد إرسال الهدية؟"))return;
  await run(async()=>{
    await request({action:"sendGift",receiverId,points,message:$("giftMessage").value});
    await refresh();
    toast("تم إرسال الهدية");
  });
}

const products=[["🍔","وجبة"],["☕","مشروب"],["📚","كتاب"],["🎮","ترفيه"],["🍿","وجبة خفيفة"],["🎁","طلب خاص"]];

function purchasePage(){
  $("page").innerHTML=`
    <div class="card"><h2>🛒 المشتريات</h2>
    <div class="notice">رصيدك: ${money(me.balance)} — حدد سعر المنتج بنفسك.</div>
    <div class="grid" style="margin-top:15px">
    ${products.map((p,i)=>`<div class="product"><div style="font-size:30px">${p[0]}</div><h3>${p[1]}</h3>
    <input type="number" id="price${i}" min=".01" step=".01" placeholder="السعر بالريال">
    <button class="gold" onclick="buy(${i})">شراء</button></div>`).join("")}
    </div></div>`;
}

async function buy(i){
  const cost=Number($("price"+i).value);
  if(!Number.isFinite(cost)||cost<=0)return toast("أدخل سعرًا صحيحًا");
  if(!confirm("تأكيد الشراء بسعر "+money(cost)+"؟"))return;
  await run(async()=>{
    await request({action:"purchase",product:products[i][1],cost});
    await refresh();
    toast("تم الشراء");
  });
}

function ledgerHTML(list){
  if(!list.length)return '<p class="muted">لا توجد عمليات.</p>';
  return list.map(x=>{
    const m=Number(x.amount_change||0),p=Number(x.points_change||0);
    const value=m?(m>0?"+":"")+money(m):p?(p>0?"+":"")+fmt(p)+" نقطة":"—";
    return `<div class="row"><div><b>${esc(x.description)}</b><div class="muted">${x.created_at?new Date(x.created_at).toLocaleString("ar-SA"):""}</div></div><b>${value}</b></div>`;
  }).join("");
}

function ledgerPage(){
  $("page").innerHTML=`<div class="card"><h2>📜 سجل العمليات</h2>
  ${me.is_admin?'<button class="red" onclick="clearLedger()">إفراغ السجل</button>':""}
  <div style="margin-top:12px">${ledgerHTML(ledger)}</div></div>`;
}

async function clearLedger(){
  if(!confirm("سيتم مسح سجل العمليات بالكامل لجميع الحسابات، دون تغيير الأرصدة. متأكد؟"))return;
  await run(async()=>{
    await request({action:"clearLedger"});
    await refresh();
    toast("تم إفراغ السجل");
  });
}

function adminPage(){
  const members=accounts.filter(a=>!a.is_admin);
  const opts=members.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
  $("page").innerHTML=`
    <div class="card"><h2>👑 الإدارة</h2>
    <label>الحساب</label><select id="admTarget">${opts}</select>
    <label>سبب العملية</label><input id="admReason" placeholder="اختياري"></div>
    ${adminForm("pointsMinus","خصم نقاط","عدد النقاط","1")}
    ${adminForm("pointsPlus","زيادة نقاط","عدد النقاط","100")}
    ${adminForm("moneyMinus","خصم فلوس","المبلغ بالريال","5.50")}
    ${adminForm("moneyPlus","زيادة فلوس","المبلغ بالريال","10.25")}
    <div class="card"><h2>إيقاف أو تفعيل حساب</h2>
    <label>الحساب</label><select id="blockTarget">${opts}</select>
    <label>الإجراء</label><select id="blockValue"><option value="true">إيقاف</option><option value="false">تفعيل</option></select>
    <button class="full red" onclick="toggleBlock()">تطبيق</button></div>`;
}

function adminForm(type,title,label,placeholder){
  return `<div class="card"><h2>${title}</h2>
  <label>${label}</label>
  <input id="val_${type}" type="number" min=".01" step="${type.includes("money")?".01":"1"}" placeholder="${placeholder}">
  <button class="full gold" onclick="adjust('${type}')">تنفيذ</button></div>`;
}

async function adjust(type){
  const val=Number($("val_"+type).value);
  if(!Number.isFinite(val)||val<=0)return toast("أدخل قيمة صحيحة");
  if(type.includes("points")&&!Number.isSafeInteger(val))return toast("النقاط لازم تكون عددًا صحيحًا");
  if(!confirm("تأكيد العملية؟"))return;
  await run(async()=>{
    await request({action:"adminAdjust",targetId:$("admTarget").value,type,val,reason:$("admReason").value});
    await refresh();
    toast("تم تنفيذ العملية");
  });
}

async function toggleBlock(){
  await run(async()=>{
    await request({action:"toggleBlock",targetId:$("blockTarget").value,blocked:$("blockValue").value==="true"});
    await refresh();
    toast("تم تحديث الحساب");
  });
}

function settingsPage(){
  $("page").innerHTML=`<div class="card"><h2>🔒 تغيير الرقم السري</h2>
  <input id="newPin" type="password" maxlength="8" inputmode="numeric" placeholder="4 إلى 8 أرقام">
  <button class="full gold" onclick="changePin()">حفظ الرقم السري</button></div>`;
}

async function changePin(){
  const newPin=$("newPin").value;
  if(!/^\d{4,8}$/.test(newPin))return toast("الرقم السري يجب أن يكون من 4 إلى 8 أرقام");
  await run(async()=>{
    await request({action:"changePin",newPin});
    $("newPin").value="";
    toast("تم تغيير الرقم السري");
  });
}

window.addEventListener("DOMContentLoaded",restore);
$("pin").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
</script>
</body>
</html>
