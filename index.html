<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183d35">
<title>عائلتنا الجميلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --main:#183d35;
  --soft:#e9f1ee;
  --bg:#f3f6f5;
  --card:#fff;
  --text:#20312c;
  --muted:#77847f;
  --danger:#b43c3c;
  --line:#e5ebe8;
  --shadow:0 5px 22px #183d3510;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Tahoma,Arial,sans-serif;min-height:100vh
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;pointer-events:auto}
.hidden{display:none!important}
header{
  background:var(--main);color:white;padding:17px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;position:sticky;top:0;z-index:100;
  box-shadow:0 3px 15px #0002
}
.brand{font-size:19px;font-weight:bold}
.header-small{font-size:12px;opacity:.8;margin-top:5px}
main{max-width:1050px;margin:auto;padding:22px 16px 55px}
h1{font-size:24px;margin:0 0 8px}
h2{font-size:19px;margin:0 0 16px}
h3{font-size:16px;margin:0 0 10px}
p{line-height:1.7}
.muted{color:var(--muted);font-size:13px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:19px;margin-bottom:15px;
  box-shadow:var(--shadow)
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.balance-box{
  background:var(--soft);padding:19px;border-radius:15px;
  border:1px solid #dce9e3
}
.balance-box strong{display:block;font-size:27px;margin-top:9px;color:var(--main)}
.balance-box span{font-size:13px;color:var(--muted)}
.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.menu-btn{
  border:1px solid var(--line);background:white;border-radius:15px;
  min-height:100px;padding:16px 9px;color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;font-weight:bold;
  transition:.18s
}
.menu-btn:hover{border-color:var(--main);background:var(--soft)}
.menu-icon{font-size:26px}
.btn{
  border:0;border-radius:11px;padding:12px 17px;
  background:var(--main);color:white;font-weight:bold
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-light{background:var(--soft);color:var(--main)}
.btn-danger{background:#f8e9e9;color:var(--danger)}
.btn-small{padding:8px 12px;font-size:12px}
.btn-block{width:100%;margin-top:12px}
.back{margin-bottom:16px}
input,select,textarea{
  width:100%;padding:12px;border:1px solid #dce4e0;
  border-radius:10px;background:white;color:var(--text);
  outline:none;margin:6px 0 13px
}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:75px}
label{font-size:13px;font-weight:bold;display:block;margin-top:8px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row>*{flex:1}
.preset-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 15px}
.preset{
  border:1px solid #dce5e0;background:white;color:var(--main);
  border-radius:10px;padding:10px 13px;font-weight:bold
}
.preset.active{background:var(--main);color:white}
.section-title{margin:22px 0 12px}
.list-item{
  border:1px solid var(--line);border-radius:13px;
  padding:14px;margin:10px 0;background:white
}
.list-item p{margin:7px 0}
.amount{font-weight:bold;color:var(--main)}
.tag{
  display:inline-block;background:var(--soft);color:var(--main);
  border-radius:30px;padding:5px 10px;font-size:11px
}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:9999;background:#183d35;color:white;padding:13px 20px;
  border-radius:12px;box-shadow:0 5px 20px #0003;
  max-width:90%;text-align:center
}
.toast.error{background:#9f3030}
.login-wrap{max-width:430px;margin:55px auto;padding:15px;position:relative;z-index:10}
.login-logo{
  width:75px;height:75px;border-radius:23px;background:var(--main);
  color:white;display:grid;place-items:center;font-size:34px;
  margin:0 auto 17px
}
.login-card{text-align:center}
.login-card input{text-align:center}
.account-choice{display:flex;gap:8px;margin:15px 0}
.account-choice button{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-weight:bold;transition:.15s}
.account-choice button.selected{background:var(--main)!important;color:white!important;border-color:var(--main)!important}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.empty{text-align:center;padding:25px;color:var(--muted)}
.small-info{font-size:12px;color:var(--muted);line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
</style>
</head>
<body>

<header id="topHeader" class="hidden">
  <div>
    <div class="brand">🌿 عائلتنا الجميلة</div>
    <div class="header-small" id="headerAccount"></div>
  </div>
  <button type="button" class="btn btn-light btn-small" onclick="goHome()">الرئيسية</button>
</header>

<section id="loginScreen" class="login-wrap">
  <div class="card login-card">
    <div class="login-logo">🏡</div>
    <h1>عائلتنا الجميلة</h1>
    <p class="muted">محفظتنا العائلية الخاصة</p>

    <div class="account-choice">
      <button type="button" class="btn btn-light selected" data-account="azoz">عزوز</button>
      <button type="button" class="btn btn-light" data-account="sahab">سحاب</button>
      <button type="button" class="btn btn-light" data-account="mama">ماما</button>
    </div>

    <label for="loginPin">الرقم السري</label>
    <input id="loginPin" type="password" inputmode="numeric" placeholder="أدخل الرقم السري" autocomplete="current-password" value="1111">
    <button type="button" class="btn btn-block" id="loginBtn">دخول</button>
    <p class="small-info">اختر حسابك وأدخل الرقم السري الخاص فيه (افتراضي: 1111).</p>
  </div>
</section>

<main id="app" class="hidden">
  <section id="homePage">
    <div class="page-heading">
      <div>
        <h1 id="welcomeTitle">أهلًا بك</h1>
        <div class="muted" id="welcomeSubtitle">محفظتك العائلية</div>
      </div>
      <span class="tag" id="roleTag"></span>
    </div>

    <div id="memberBalances" class="balance-grid">
      <div class="balance-box">
        <span>رصيد الفلوس</span>
        <strong id="moneyValue">0.00 ر.س</strong>
      </div>
      <div class="balance-box">
        <span>رصيد النقاط</span>
        <strong id="pointsValue">0</strong>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>حسابك</h3>
      <div class="row">
        <span id="accountName"></span>
        <button type="button" class="btn btn-danger btn-small" onclick="logoutPrompt()">تسجيل الخروج</button>
      </div>
    </div>
  </section>
</main>

<footer id="footer" class="hidden">عائلتنا الجميلة · محفظة عائلية خاصة</footer>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = "https://ayfxtomfqrantxmpqgof.supabase.co";
const SUPABASE_KEY = "sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe";
const API_URL = SUPABASE_URL + "/functions/v1/family-api";

let selectedAccount = "azoz";
let currentUser = null;
let token = null;
let currentData = null;
let toastTimer = null;

const accountNames = {
  azoz: "عزوز",
  sahab: "سحاب",
  mama: "ماما"
};

function $(id){return document.getElementById(id)}

function showToast(message,error=false){
  const el=$("toast");
  if(!el)return;
  el.textContent=message;
  el.classList.remove("hidden","error");
  if(error)el.classList.add("error");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add("hidden"),4000);
}

async function api(action,data={}){
  const headers={"Content-Type":"application/json","apikey":SUPABASE_KEY};
  if(token)headers.Authorization="Bearer "+token;

  let response;
  try{
    response=await fetch(API_URL,{
      method:"POST",
      headers,
      body:JSON.stringify({action,...data})
    });
  }catch(err){
    throw new Error("تعذر الاتصال بالخادم (تأكد من الإنترنت أو إعدادات CORS)");
  }

  let result;
  try{
    result=await response.json();
  }catch(e){
    throw new Error("استجابة الخادم غير صالحة");
  }

  if(!response.ok)throw new Error(result.error||"حدث خطأ في الخادم");
  return result;
}

async function login(){
  const pinInput = $("loginPin");
  const pin = pinInput ? pinInput.value.trim() : "";
  if(!pin)return showToast("أدخل الرقم السري",true);

  const button=$("loginBtn");
  const origText = button.textContent;
  button.disabled = true;
  button.textContent = "جاري الدخول...";

  try{
    const result = await api("login",{account_id:selectedAccount,pin});
    token = result.token;
    currentUser = result.profile;
    if(pinInput)pinInput.value="";
    
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("topHeader").classList.remove("hidden");
    $("footer").classList.remove("hidden");
    
    showToast("تم تسجيل الدخول بنجاح");
    renderHome();
  }catch(error){
    showToast(error.message,true);
  }finally{
    button.disabled = false;
    button.textContent = origText;
  }
}

function renderHome(){
  if(!currentUser)return;
  const admin = currentUser.role === "admin";
  const name = currentUser.display_name || accountNames[currentUser.id] || "مستخدم";

  $("welcomeTitle").textContent = "أهلًا " + name;
  $("welcomeSubtitle").textContent = admin ? "إدارة المحفظة العائلية" : "محفظتك العائلية";
  $("headerAccount").textContent = name;
  $("accountName").textContent = name;
  $("roleTag").textContent = admin ? "ماما · إدارة" : "عضو العائلة";
}

function goHome(){
  window.scrollTo({top:0,behavior:"smooth"});
}

function logoutPrompt(){
  token = null;
  currentUser = null;
  $("app").classList.add("hidden");
  $("topHeader").classList.add("hidden");
  $("footer").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  showToast("تم تسجيل الخروج");
}

document.addEventListener("DOMContentLoaded",()=>{
  // ربط أزرار اختيار الحساب بشكل قاطع وتفاعلي
  const accountButtons = document.querySelectorAll(".account-choice button");
  accountButtons.forEach(btn=>{
    btn.addEventListener("click",function(e){
      e.preventDefault();
      accountButtons.forEach(b=>b.classList.remove("selected"));
      this.classList.add("selected");
      selectedAccount = this.getAttribute("data-account");
    });
  });

  // ربط زر الدخول
  const loginBtn = $("loginBtn");
  if(loginBtn){
    loginBtn.addEventListener("click", function(e){
      e.preventDefault();
      login();
    });
  }

  // دعم زر Enter في خانة الرقم السري
  const pinInput = $("loginPin");
  if(pinInput){
    pinInput.addEventListener("keydown",e=>{
      if(e.key==="Enter"){
        e.preventDefault();
        login();
      }
    });
  }
});
</script>
</body>
</html>
