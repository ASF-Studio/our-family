
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#183d35">
<title>عائلتنا الجميلة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --main:#183d35;
  --main2:#24594d;
  --soft:#eaf2ef;
  --bg:#f4f7f5;
  --card:#fff;
  --text:#1d2925;
  --muted:#77847f;
  --line:#e5ece8;
  --danger:#c74646;
  --gold:#c18a2d;
  --shadow:0 8px 28px rgba(23,55,45,.07);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#loginScreen{
  min-height:100vh;display:grid;place-items:center;padding:20px;
  background:linear-gradient(145deg,var(--main),#102a25);
}
.login-card{
  width:min(420px,100%);background:white;border-radius:25px;
  padding:28px;box-shadow:0 20px 60px #0002;
}
.logo{
  width:65px;height:65px;border-radius:20px;background:var(--soft);
  color:var(--main);display:grid;place-items:center;font-size:30px;
  margin:0 auto 15px;
}
.login-card h1{text-align:center;margin:0 0 8px;font-size:25px}
.login-card p{text-align:center;color:var(--muted);margin:0 0 25px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:#fff;color:var(--text);outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--main)}
textarea{resize:vertical;min-height:85px}
.btn{
  border:0;border-radius:12px;padding:13px 17px;
  background:var(--main);color:white;font-weight:bold;
  transition:.15s;
}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.full{width:100%}
.btn.light{background:var(--soft);color:var(--main)}
.btn.danger{background:#fff0f0;color:var(--danger)}
.btn.gold{background:#fff5df;color:#805710}
.btn.small{padding:9px 12px;font-size:13px}
.error{color:var(--danger);font-size:13px;margin-top:12px}
.success{color:#18734d;font-size:13px;margin-top:12px}
#app{min-height:100vh}
.topbar{
  height:70px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:bold;color:var(--main)}
.brand-mark{
  width:39px;height:39px;border-radius:13px;background:var(--main);
  color:#fff;display:grid;place-items:center;font-size:19px;
}
.top-actions{display:flex;align-items:center;gap:10px}
.user-chip{background:var(--soft);color:var(--main);padding:9px 13px;border-radius:30px;font-size:13px}
.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 70px)}
.sidebar{
  background:#fff;border-left:1px solid var(--line);padding:20px 14px;
}
.nav-title{font-size:11px;color:var(--muted);padding:12px 12px 8px}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:11px;text-align:right;
  padding:12px;border:0;background:transparent;border-radius:12px;
  color:#53615b;margin:3px 0;font-size:14px;
}
.nav-btn .ico{width:25px;text-align:center;font-size:17px}
.nav-btn.active{background:var(--soft);color:var(--main);font-weight:bold}
.nav-btn:hover{background:#f2f6f4}
main{padding:27px;min-width:0;max-width:1250px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
.page-head h1{font-size:23px;margin:0 0 7px}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:19px;box-shadow:var(--shadow);min-width:0;
}
.card h3{margin:0 0 13px;font-size:16px}
.balance-card{background:linear-gradient(135deg,var(--main),var(--main2));color:white;border:0}
.balance-card .muted{color:#d0e2db}
.balance-value{font-size:30px;font-weight:bold;margin:12px 0 5px}
.balance-label{font-size:13px;color:var(--muted)}
.balance-row{display:flex;justify-content:space-between;gap:15px;align-items:center}
.stat{padding:17px;border-radius:15px;background:#f7faf8}
.stat strong{display:block;font-size:23px;margin-top:7px}
.stat span{font-size:12px;color:var(--muted)}
.action-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.action-card{
  background:white;border:1px solid var(--line);border-radius:17px;
  padding:19px 13px;text-align:center;cursor:pointer;transition:.15s;
}
.action-card:hover{transform:translateY(-2px);border-color:var(--main)}
.action-card .action-icon{font-size:25px;margin-bottom:9px}
.action-card b{display:block;font-size:13px}
.action-card span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.section-title{font-size:16px;margin:25px 0 13px}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.preset{
  padding:10px 15px;border:1px solid var(--line);border-radius:11px;
  background:white;color:var(--main);font-weight:bold;
}
.preset.selected{background:var(--main);color:white;border-color:var(--main)}
.notice{
  border:1px solid var(--line);background:#fff;border-radius:14px;
  padding:14px;margin:10px 0;display:flex;justify-content:space-between;
  gap:12px;align-items:flex-start;
}
.notice.unread{border-right:4px solid var(--gold)}
.notice h4{margin:0 0 6px;font-size:14px}
.notice p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}
.reward-card{
  border:1px solid #eadbb8;background:linear-gradient(135deg,#fffdf7,#fff8e9);
  border-radius:17px;padding:17px;margin:12px 0;
}
.reward-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.reward-amount{font-size:23px;font-weight:bold;color:#805710;margin:12px 0 5px}
.reward-card p{font-size:13px;color:#786b52;line-height:1.7;margin:5px 0 13px}
.tag{font-size:11px;background:#f3e7ca;color:#805710;padding:6px 9px;border-radius:20px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:550px}
th,td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--line);font-size:13px}
th{background:#f7faf8;color:var(--muted);font-weight:bold}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.empty{text-align:center;padding:35px 12px;color:var(--muted);font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.inline{display:flex;gap:10px;align-items:center}
.inline>*{flex:1;min-width:0}
.profile-row{display:flex;align-items:center;gap:12px}
.avatar{
  width:45px;height:45px;border-radius:15px;background:var(--soft);
  color:var(--main);display:grid;place-items:center;font-weight:bold;font-size:17px;
}
.account-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.account-row:last-child{border-bottom:0}
.color-list{display:flex;gap:10px;flex-wrap:wrap}
.color-dot{width:35px;height:35px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}
.color-dot.active{box-shadow:0 0 0 3px var(--main)}
.mobile-menu{display:none}
.toast{
  position:fixed;bottom:22px;left:22px;z-index:30;
  background:#183d35;color:#fff;padding:14px 18px;border-radius:13px;
  box-shadow:var(--shadow);max-width:min(380px,90vw);font-size:13px;
}
.toast.bad{background:#a93434}
.modal-bg{
  position:fixed;inset:0;background:#0007;z-index:40;
  display:grid;place-items:center;padding:18px;
}
.modal{
  width:min(400px,100%);background:#fff;border-radius:19px;padding:22px;
}
.modal h3{margin:0 0 8px}
.modal p{font-size:13px;color:var(--muted);line-height:1.7}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions>*{flex:1}
@media(max-width:850px){
  .layout{grid-template-columns:1fr}
  .sidebar{
    display:flex;overflow:auto;gap:5px;padding:8px;
    border-left:0;border-bottom:1px solid var(--line);
    position:sticky;top:70px;z-index:9;
  }
  .nav-title{display:none}
  .nav-btn{width:auto;white-space:nowrap;margin:0;padding:10px}
  .nav-btn .ico{width:auto}
  main{padding:18px}
}
@media(max-width:600px){
  .topbar{padding:0 13px;height:62px}
  .layout{min-height:calc(100vh - 62px)}
  .sidebar{top:62px}
  .user-chip{display:none}
  .brand{font-size:14px}
  .brand-mark{width:34px;height:34px}
  main{padding:15px 12px}
  .grid,.grid.three{grid-template-columns:1fr}
  .action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-head h1{font-size:20px}
  .balance-value{font-size:26px}
}
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <div class="logo">⌂</div>
    <h1>عائلتنا الجميلة</h1>
    <p>محفظة العائلة الخاصة</p>
    <div class="field">
      <label>اختر الحساب</label>
      <select id="loginAccount">
        <option value="azoz">عزوز</option>
        <option value="sahab">سحاب</option>
        <option value="mama">ماما</option>
      </select>
    </div>
    <div class="field">
      <label>الرقم السري</label>
      <input id="loginPin" type="password" inputmode="numeric" placeholder="أدخل الرقم السري">
    </div>
    <button class="btn full" id="loginBtn" onclick="login()">تسجيل الدخول</button>
    <div id="loginMessage"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">⌂</div>
      <span>عائلتنا الجميلة</span>
    </div>
    <div class="top-actions">
      <span class="user-chip" id="userChip">الحساب</span>
      <button class="btn light small" onclick="openLogout()">تسجيل الخروج</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main>
      <section id="page-home" class="page"></section>
      <section id="page-wallet" class="page hidden"></section>
      <section id="page-convert" class="page hidden"></section>
      <section id="page-gifts" class="page hidden"></section>
      <section id="page-rewards" class="page hidden"></section>
      <section id="page-purchase" class="page hidden"></section>
      <section id="page-records" class="page hidden"></section>
      <section id="page-settings" class="page hidden"></section>
      <section id="page-admin-money" class="page hidden"></section>
      <section id="page-admin-points" class="page hidden"></section>
      <section id="page-admin-accounts" class="page hidden"></section>
      <section id="page-admin-notifications" class="page hidden"></section>
    </main>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<div id="modalRoot"></div>

<script>
const API_URL = "https://ayfxtomfqrantxmpqgof.supabase.co/functions/v1/family-api";
const SUPABASE_KEY = "sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe";

let token = "";
let profile = null;
let appData = null;
let currentPage = "home";
let selectedAccount = "azoz";
let selectedConvert = 25;
let selectedGift = 25;
let selectedMoneyPreset = 5;
let selectedPointsPreset = 25;
let themeColor = "#183d35";

const $ = id => document.getElementById(id);
const isMama = () => profile?.role === "admin" || profile?.id === "mama";
const money = value => Number(value || 0).toLocaleString("ar-SA",{maximumFractionDigits:3});
const points = value => Number(value || 0).toLocaleString("ar-SA",{maximumFractionDigits:0});
const accountName = id => ({azoz:"عزوز",sahab:"سحاب",mama:"ماما"}[id] || id);
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function api(action, data = {}) {
  const headers = {
    "Content-Type":"application/json",
    "apikey":SUPABASE_KEY
  };
  if (token) headers.Authorization = "Bearer " + token;

  const response = await fetch(API_URL,{
    method:"POST",headers,
    body:JSON.stringify({action,...data})
  });

  let result;
  try { result = await response.json(); }
  catch { throw new Error("تعذر قراءة رد السيرفر"); }

  if (!response.ok || result.error) throw new Error(result.error || "حدث خطأ");
  return result;
}

function toast(message,bad=false){
  const el=$("toast");
  el.textContent=message;
  el.className="toast"+(bad?" bad":"");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.add("hidden"),3500);
}

function setTheme(color){
  themeColor=color;
  document.documentElement.style.setProperty("--main",color);
  document.querySelector('meta[name="theme-color"]').content=color;
}

async function login(){
  const btn=$("loginBtn");
  const account_id=$("loginAccount").value;
  const pin=$("loginPin").value.trim();
  $("loginMessage").textContent="";
  if(!pin){$("loginMessage").innerHTML='<div class="error">اكتب الرقم السري أولاً</div>';return}
  btn.disabled=true;btn.textContent="جاري الدخول...";
  try{
    const result=await api("login",{account_id,pin});
    token=result.token;
    profile=result.profile;
    localStorage.setItem("family_token",token);
    await loadData();
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userChip").textContent=profile.display_name || accountName(profile.id);
    buildNavigation();
    showPage("home");
  }catch(e){
    $("loginMessage").innerHTML='<div class="error">'+escapeHTML(e.message)+'</div>';
  }finally{
    btn.disabled=false;btn.textContent="تسجيل الدخول";
  }
}

async function loadData(){
  const result=await api("get",{account_id:selectedAccount});
  appData=result;
  if(result.settings?.theme_color){
    setTheme(result.settings.theme_color);
  }
  return result;
}

async function refresh(){
  await loadData();
  renderAll();
}

function buildNavigation(){
  const member=[
    ["home","⌂","الرئيسية"],
    ["wallet","◈","محفظتي"],
    ["convert","⇄","تحويل النقاط"],
    ["gifts","🎁","إرسال هدية"],
    ["rewards","✉","مكافآتي"],
    ["purchase","🛍","شراء"],
    ["records","▤","سجل العمليات"],
    ["settings","⚙","الإعدادات"]
  ];
  const admin=[
    ["home","⌂","الرئيسية"],
    ["admin-money","ر.س","إدارة الفلوس"],
    ["admin-points","✦","إدارة النقاط"],
    ["admin-accounts","♙","الحسابات"],
    ["admin-notifications","♧","الإشعارات"],
    ["records","▤","السجلات"],
    ["settings","⚙","الإعدادات"]
  ];
  const items=isMama()?admin:member;
  $("sidebar").innerHTML=items.map(([id,ico,label])=>
    `<button class="nav-btn ${currentPage===id?"active":""}" onclick="showPage('${id}')">
      <span class="ico">${ico}</span><span>${label}</span>
    </button>`
  ).join("");
}

function showPage(page){
  currentPage=page;
  document.querySelectorAll(".page").forEach(el=>el.classList.add("hidden"));
  const target=$("page-"+page);
  if(target)target.classList.remove("hidden");
  buildNavigation();
  renderPage(page);
  window.scrollTo({top:0,behavior:"smooth"});
}

function pageHead(title,subtitle=""){
  return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div></div>`;
}

function balanceCard(b){
  return `<div class="card balance-card">
    <div class="balance-row"><span class="muted">الرصيد المالي</span><span>المحفظة</span></div>
    <div class="balance-value">${money(b?.money)} <small style="font-size:14px">ريال</small></div>
    <div class="muted">رصيدك الحالي</div>
    <hr style="border-color:#ffffff30">
    <div class="balance-row"><span class="muted">النقاط</span><strong>${points(b?.points)} نقطة</strong></div>
  </div>`;
}

function homePage(){
  const b=appData?.balance||{};
  const memberActions=[
    ["wallet","◈","محفظتي","عرض رصيدك"],
    ["convert","⇄","تحويل النقاط","استبدل نقاطك"],
    ["gifts","🎁","إرسال هدية","أهدِ أحد أفراد العائلة"],
    ["rewards","✉","مكافآتي","استرداد مكافآتك"],
    ["purchase","🛍","شراء","استخدم رصيدك"],
    ["records","▤","سجل العمليات","راجع عملياتك"],
    ["settings","⚙","الإعدادات","تخصيص حسابك"]
  ];
  const adminActions=[
    ["admin-money","ر.س","إدارة الفلوس","إضافة أو خصم"],
    ["admin-points","✦","إدارة النقاط","إضافة أو خصم"],
    ["admin-accounts","♙","الحسابات","إدارة حسابات العائلة"],
    ["admin-notifications","♧","الإشعارات","إدارة إشعارات العائلة"],
    ["records","▤","السجلات","متابعة العمليات"],
    ["settings","⚙","الإعدادات","تخصيص الحساب"]
  ];
  const actions=isMama()?adminActions:memberActions;
  $("page-home").innerHTML=`
    ${pageHead("الرئيسية","مرحباً ${escapeHTML(appData.profile?.display_name||accountName(profile.id))}")}
    ${!isMama()?balanceCard(b):`
      <div class="card balance-card">
        <div class="muted">لوحة تحكم ماما</div>
        <div class="balance-value">إدارة العائلة</div>
        <div class="muted">تابعي الأرصدة والمكافآت والحسابات من مكان واحد</div>
      </div>`}
    <h2 class="section-title">الخدمات</h2>
    <div class="action-grid">
      ${actions.map(([id,ico,title,desc])=>`
        <div class="action-card" onclick="showPage('${id}')">
          <div class="action-icon">${ico}</div><b>${title}</b><span>${desc}</span>
        </div>`).join("")}
    </div>
    ${!isMama()?`
      <h2 class="section-title">آخر المكافآت</h2>
      ${renderRecentRewards(3)}
    `:""}
  `;
}

function renderRecentRewards(limit=100){
  const rows=(appData?.rewardCards||[]).filter(x=>x.status==="pending").slice(0,limit);
  if(!rows.length)return '<div class="card empty">ما عندك مكافآت جديدة حالياً</div>';
  return rows.map(rewardCardHTML).join("");
}

function rewardCardHTML(r){
  const amount= r.kind==="conversion"
    ? `${points(r.amount)} نقطة`
    : r.kind==="money" ? `${money(r.amount)} ريال` : `${points(r.amount)} نقطة`;
  const description=r.description||"";
  return `<div class="reward-card">
    <div class="reward-top"><strong>${escapeHTML(r.title)}</strong><span class="tag">بانتظار الاسترداد</span></div>
    <div class="reward-amount">${amount}</div>
    <p>${escapeHTML(description)}</p>
    <button class="btn gold full" onclick="redeem('${r.id}')">استرداد</button>
  </div>`;
}

function walletPage(){
  const b=appData?.balance||{};
  $("page-wallet").innerHTML=`
    ${pageHead("محفظتي","تفاصيل رصيدك المالي والنقاط")}
    ${balanceCard(b)}
    <div class="grid" style="margin-top:16px">
      <div class="card"><div class="balance-label">الرصيد المالي</div><div class="balance-value" style="color:var(--main)">${money(b.money)} ريال</div></div>
      <div class="card"><div class="balance-label">رصيد النقاط</div><div class="balance-value" style="color:var(--gold)">${points(b.points)} نقطة</div></div>
    </div>
  `;
}

function convertPage(){
  const choices=[25,50,100,1000];
  const value=selectedConvert;
  const result=value/200;
  $("page-convert").innerHTML=`
    ${pageHead("تحويل النقاط","اختر عدد النقاط لإنشاء بطاقة استرداد")}
    <div class="card">
      <h3>كم نقطة تبي تحوّل؟</h3>
      <div class="preset-row">
        ${choices.map(n=>`<button class="preset ${value===n?"selected":""}" onclick="selectConvert(${n})">${n} نقطة</button>`).join("")}
      </div>
      <div class="stat"><span>المبلغ اللي تستلمه عند الاسترداد</span><strong>${money(result)} ريال</strong></div>
      <p class="muted" style="font-size:12px;line-height:1.8">كل 1000 نقطة تساوي 5 ريالات. عند إنشاء البطاقة ما تنخصم النقاط مباشرة؛ تنخصم عند ضغطك على «استرداد».</p>
      <button class="btn full" onclick="createConversion()">إنشاء بطاقة الاسترداد</button>
    </div>

    ${renderRecentRewards()}
  `;
}

function selectConvert(n){selectedConvert=n;renderPage("convert")}

async function createConversion(){
  try{
    const result=await api("convert",{points:selectedConvert});
    await refresh();toast("تم إنشاء بطاقة الاسترداد");
    showPage("rewards");
  }catch(e){toast(e.message,true)}
}

function giftsPage(){

    ${pageHead("إرسال هدية","أرسل نقاطاً إلى فرد آخر من العائلة")}
    <div class="card">
      <div class="field"><label>المستلم</label>
        <select id="giftTo">
          <option value="${profile.id==="azoz"?"sahab":"azoz"}">${profile.id==="azoz"?"سحاب":"عزوز"}</option>

      <div class="field"><label>عدد النقاط</label>

      <p class="muted" style="font-size:12px">سيتم خصم النقاط من رصيدك وإضافتها إلى رصيد المستلم مباشرة.</p>
    </div>
  `;
}
function selectGift(n){selectedGift=n;renderPage("gifts")}

async function sendGift(){
  try{
    await api("gift",{
      to:$("giftTo").value,
      points:selectedGift,
      message:$("giftMessage").value
    });
    await refresh();toast("تم إرسال الهدية بنجاح");
    showPage("home");
  }catch(e){toast(e.message,true)}

function rewardsPage(){
  $("page-rewards").innerHTML=`
    ${pageHead("مكافآتي","الرسائل والمبالغ والنقاط اللي وصلتك من ماما أو من تحويلاتك")}
    ${renderRecentRewards()}
    <h2 class="section-title">البطاقات المستردة</h2>
    ${(appData?.rewardCards||[]).filter(x=>x.status==="redeemed").length
      ?(appData.rewardCards||[]).filter(x=>x.status==="redeemed").map(r=>`
        <div class="notice">
          <div><h4>${escapeHTML(r.title)}</h4><p>${escapeHTML(r.description||"تم الاسترداد")}</p></div>

        </div>`).join("")

async function redeem(id){
  if(!confirm("متأكد إنك تبي تسترد البطاقة؟"))return;
  try{
    await api("redeem_reward",{reward_id:id});
    await refresh();toast("تم الاسترداد وإضافة المبلغ إلى محفظتك");
    showPage("rewards");
  }catch(e){toast(e.message,true)}
}

function purchasePage(){
  const categories=[
    "ألعاب","Roblox","مقاضي","مطاعم","أدوات مدرسية","إلكترونيات",
    "ملابس","هدايا","أخرى"
  ];
  $("page-purchase").innerHTML=`
    ${pageHead("الشراء","اكتب طلبك والمبلغ، وسيتم خصمه من رصيد الفلوس")}
    <div class="card">
      <div class="field"><label>القسم</label>
        <select id="purchaseCategory">${categories.map(x=>`<option>${x}</option>`).join("")}</select>
      </div>
      <div class="field"><label>وش تبي تشتري؟</label>
        <input id="purchaseItem" maxlength="160" placeholder="مثال: لعبة أو مقاضي أو أدوات مدرسية">
      </div>
      <div class="field"><label>المبلغ بالريال</label>
        <input id="purchaseAmount" type="number" min="0.01" step="0.01" placeholder="مثال: 15">
      </div>
      <button class="btn full" onclick="makePurchase()">اشتري</button>
      <p class="muted" style="font-size:12px;line-height:1.8">هذه عملية شراء داخل محفظة العائلة: يتم تسجيل الطلب وخصم المبلغ من رصيدك. ما فيه دفع إلكتروني لمتجر خارجي.</p>
    </div>
    <h2 class="section-title">مشترياتي السابقة</h2>
    ${purchaseHistory()}
  `;
}

function purchaseHistory(){
  const rows=appData?.purchases||[];
  if(!rows.length)return '<div class="card empty">ما عندك مشتريات مسجلة</div>';
  return `<div class="table-wrap"><table><thead><tr><th>المنتج</th><th>القسم</th><th>المبلغ</th><th>التاريخ</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${escapeHTML(r.item)}</td><td>${escapeHTML(r.category)}</td><td>${money(r.amount)} ريال</td><td>${new Date(r.created_at).toLocaleDateString("ar-SA")}</td></tr>`).join("")}
  </tbody></table></div>`;
}

async function makePurchase(){
  const category=$("purchaseCategory").value;
  const item=$("purchaseItem").value.trim();
  const amount=Number($("purchaseAmount").value);
  if(!item||!Number.isFinite(amount)||amount<=0){toast("اكتب المنتج والمبلغ بشكل صحيح",true);return}
  if(!confirm(`تأكيد شراء "${item}" بمبلغ ${money(amount)} ريال؟`))return;
  try{
    await api("purchase",{category,item,amount});
    await refresh();toast("تم الشراء وتسجيل العملية");
    showPage("purchase");
  }catch(e){toast(e.message,true)}
}

function recordsPage(){
  const rows=appData?.ledger||[];
  $("page-records").innerHTML=`
    ${pageHead("سجل العمليات","تفاصيل الإضافات والخصومات والهدايا والشراء")}
    ${rows.length?`<div class="table-wrap"><table>
      <thead><tr><th>العملية</th><th>المبلغ</th><th>الوحدة</th><th>التفاصيل</th><th>التاريخ</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${escapeHTML(r.action)}</td>
        <td>${money(r.amount)}</td>
        <td>${r.unit==="money"?"ريال":"نقطة"}</td>
        <td>${escapeHTML(r.description||"-")}</td>
        <td>${new Date(r.created_at).toLocaleString("ar-SA")}</td>
      </tr>`).join("")}</tbody></table></div>`
      :'<div class="card empty">ما فيه عمليات مسجلة</div>'}
  `;
}

function settingsPage(){
  const settings=appData?.settings||{};
  const name=appData?.profile?.display_name||profile.display_name||accountName(profile.id);
  const colors=["#183d35","#2457a6","#6845a5","#a34a70","#b36a25","#333b49"];
  $("page-settings").innerHTML=`
    ${pageHead("الإعدادات","إدارة اسم الحساب ومظهر التطبيق")}
    <div class="card">
      <div class="field"><label>الاسم الظاهر</label><input id="settingName" maxlength="30" value="${escapeHTML(name)}"></div>
      <div class="field"><label>لون التطبيق</label>
        <div class="color-list">${colors.map(c=>`<button class="color-dot ${themeColor===c?"active":""}" style="background:${c}" onclick="previewColor('${c}')"></button>`).join("")}</div>
      </div>
      <button class="btn full" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>
    <div class="card" style="margin-top:15px">
      <h3>تغيير الرقم السري</h3>
      <div class="field"><label>الرقم الحالي</label><input id="oldPin" type="password" inputmode="numeric"></div>
      <div class="field"><label>الرقم الجديد</label><input id="newPin" type="password" inputmode="numeric"></div>
      <button class="btn light full" onclick="changePin()">تغيير الرقم السري</button>
    </div>
  `;
}
function previewColor(c){setTheme(c);renderPage("settings")}
async function saveSettings(){
  try{
    await api("save_settings",{
      display_name:$("settingName").value,
      theme_color:themeColor
    });
    await refresh();toast("تم حفظ الإعدادات");
  }catch(e){toast(e.message,true)}
}
async function changePin(){
  const old_pin=$("oldPin").value,new_pin=$("newPin").value;
  if(!old_pin||!new_pin){toast("اكتب الرقمين",true);return}
  try{
    await api("change_pin",{old_pin,new_pin});
    $("oldPin").value="";$("newPin").value="";
    toast("تم تغيير الرقم السري");
  }catch(e){toast(e.message,true)}
}

function adminAccountOptions(){
  return `<option value="azoz" ${selectedAccount==="azoz"?"selected":""}>عزوز</option>
    <option value="sahab" ${selectedAccount==="sahab"?"selected":""}>سحاب</option>`;
}

function adminMoneyPage(){
  const b=(appData?.allBalances||[]).find(x=>x.account_id===selectedAccount)||{};
  $("page-admin-money").innerHTML=`
    ${pageHead("إدارة الفلوس","إضافة مكافأة مالية أو خصم مبلغ من حساب")}
    <div class="card">
      <div class="field"><label>الحساب</label><select id="moneyAccount" onchange="changeAdminAccount(this.value)">${adminAccountOptions()}</select></div>
      <div class="stat"><span>الرصيد الحالي</span><strong>${money(b.money)} ريال</strong></div>
    </div>
    <div class="grid" style="margin-top:15px">
      <div class="card">
        <h3>زيادة فلوس</h3>
        <p class="muted" style="font-size:12px">ترسل بطاقة مكافأة، ويضيفها المستلم عند الاسترداد.</p>
        <div class="field"><label>المبلغ بالريال</label><input id="addMoney" type="number" min="0.01" step="0.01" placeholder="المبلغ"></div>
        <div class="field"><label>سبب الإضافة</label><input id="addMoneyReason" maxlength="200" placeholder="مثال: مكافأة"></div>
        <button class="btn full" onclick="adminAdjust('money','add')">إرسال مكافأة مالية</button>
      </div>
      <div class="card">
        <h3>خصم فلوس</h3>
        <div class="field"><label>المبلغ بالريال</label><input id="removeMoney" type="number" min="0.01" step="0.01" placeholder="المبلغ"></div>
        <div class="field"><label>سبب الخصم</label><input id="removeMoneyReason" maxlength="200" placeholder="سبب الخصم"></div>
        <button class="btn danger full" onclick="adminAdjust('money','remove')">خصم من الرصيد</button>
      </div>
    </div>
  `;
}

function adminPointsPage(){
  const b=(appData?.allBalances||[]).find(x=>x.account_id===selectedAccount)||{};
  const presets=[25,50,100,250,500,1000,2500,5000];
  $("page-admin-points").innerHTML=`
    ${pageHead("إدارة النقاط","إرسال نقاط كمكافأة أو خصمها من الحساب")}
    <div class="card">
      <div class="field"><label>الحساب</label><select id="pointsAccount" onchange="changeAdminAccount(this.value)">${adminAccountOptions()}</select></div>
      <div class="stat"><span>النقاط الحالية</span><strong>${points(b.points)} نقطة</strong></div>
    </div>
    <div class="grid" style="margin-top:15px">
      <div class="card">
        <h3>زيادة نقاط</h3>
        <p class="muted" style="font-size:12px">ترسل بطاقة نقاط، ويضيفها المستلم عند الاسترداد.</p>
        <div class="preset-row">${presets.map(n=>`<button class="preset ${selectedPointsPreset===n?"selected":""}" onclick="selectAdminPoints(${n})">${n}</button>`).join("")}</div>
        <div class="field"><label>سبب الإضافة</label><input id="addPointsReason" maxlength="200" placeholder="سبب المكافأة"></div>
        <button class="btn full" onclick="adminAdjust('points','add')">إرسال النقاط</button>
      </div>
      <div class="card">
        <h3>خصم نقاط</h3>
        <div class="preset-row">${presets.map(n=>`<button class="preset" onclick="setRemovePoints(${n})">${n}</button>`).join("")}</div>
        <div class="field"><label>عدد النقاط</label><input id="removePoints" type="number" min="1" step="1" placeholder="عدد النقاط"></div>
        <div class="field"><label>سبب الخصم</label><input id="removePointsReason" maxlength="200" placeholder="سبب الخصم"></div>
        <button class="btn danger full" onclick="adminAdjust('points','remove')">خصم النقاط</button>
      </div>
    </div>
  `;
}
function selectAdminPoints(n){selectedPointsPreset=n;renderPage("admin-points")}
function setRemovePoints(n){$("removePoints").value=n}
async function changeAdminAccount(id){
  selectedAccount=id;
  await loadData();
  renderPage(currentPage);
}

async function adminAdjust(unit,direction){
  let amount,description;
  if(unit==="money"){
    amount=Number($(direction==="add"?"addMoney":"removeMoney").value);
    description=$(direction==="add"?"addMoneyReason":"removeMoneyReason").value;
  }else{
    amount=direction==="add"?selectedPointsPreset:Number($("removePoints").value);
    description=$(direction==="add"?"addPointsReason":"removePointsReason").value;
  }
  if(!Number.isFinite(amount)||amount<=0||(unit==="points"&&!Number.isInteger(amount))){
    toast("اكتب مبلغ أو عدد نقاط صحيح",true);return;
  }
  const isAdd=direction==="add";
  const label=isAdd?"إرسال مكافأة":"خصم";
  if(!confirm(`تأكيد ${label} ${amount} ${unit==="money"?"ريال":"نقطة"} إلى حساب ${accountName(selectedAccount)}؟`))return;
  try{
    await api("adjust",{
      account_id:selectedAccount,
      unit,
      amount:isAdd?amount:-amount,
      description
    });
    await loadData();renderPage(currentPage);
    toast(isAdd?"تم إرسال بطاقة المكافأة":"تم الخصم بنجاح");
  }catch(e){toast(e.message,true)}
}

function adminAccountsPage(){
  const accounts=appData?.accounts||[];
  const balances=appData?.allBalances||[];
  $("page-admin-accounts").innerHTML=`
    ${pageHead("حسابات العائلة","متابعة الأرصدة وإيقاف الحسابات أو تفعيلها")}
    <div class="card">
      ${accounts.map(a=>{
        const b=balances.find(x=>x.account_id===a.id)||{};
        return `<div class="account-row">
          <div class="profile-row">
            <div class="avatar">${accountName(a.id).slice(0,1)}</div>
            <div><b>${accountName(a.id)}</b><div class="muted" style="font-size:12px">${money(b.money)} ريال · ${points(b.points)} نقطة</div></div>
          </div>
          <button class="btn small ${a.blocked?"light":"danger"}" onclick="toggleBlock('${a.id}',${!a.blocked})">${a.blocked?"تفعيل الحساب":"إيقاف الحساب"}</button>
        </div>`;
      }).join("")}
    </div>
  `;
}

async function toggleBlock(id,blocked){
  if(!confirm(`${blocked?"إيقاف":"تفعيل"} حساب ${accountName(id)}؟`))return;
  try{
    await api("block",{account_id:id,blocked});
    await loadData();renderPage("admin-accounts");
    toast(blocked?"تم إيقاف الحساب":"تم تفعيل الحساب");
  }catch(e){toast(e.message,true)}
}

function adminNotificationsPage(){
  const rows=appData?.notifications||[];
  $("page-admin-notifications").innerHTML=`
    ${pageHead("إشعارات العائلة","ماما تقدر تحذف كل إشعار بشكل مستقل")}
    ${rows.length?rows.map(n=>`
      <div class="notice ${n.read_at?"":"unread"}">
        <div><h4>${escapeHTML(n.title)} · ${accountName(n.account_id)}</h4>
          <p>${escapeHTML(n.message)}</p>
          <p style="margin-top:6px">${new Date(n.created_at).toLocaleString("ar-SA")}</p>
        </div>
        <button class="btn danger small" onclick="deleteNotification('${n.id}')">حذف</button>
      </div>`).join("")
      :'<div class="card empty">ما فيه إشعارات حالياً</div>'}
  `;
}
async function deleteNotification(id){
  if(!confirm("تحذف هذا الإشعار؟"))return;
  try{
    await api("notifications_delete",{id});
    await refresh();showPage("admin-notifications");
    toast("تم حذف الإشعار");
  }catch(e){toast(e.message,true)}
}

function renderPage(page){
  const renderers={
    home:homePage,wallet:walletPage,convert:convertPage,gifts:giftsPage,
    rewards:rewardsPage,purchase:purchasePage,records:recordsPage,
    settings:settingsPage,"admin-money":adminMoneyPage,
    "admin-points":adminPointsPage,"admin-accounts":adminAccountsPage,
    "admin-notifications":adminNotificationsPage
  };
  if(renderers[page])renderers[page]();
}
function renderAll(){renderPage(currentPage)}

function openLogout(){
  $("modalRoot").innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h3>تأكيد تسجيل الخروج</h3>
        <p>اكتب الرقم السري الحالي للتأكد من هويتك قبل الخروج.</p>
        <div class="field"><label>الرقم السري</label><input id="logoutPin" type="password" inputmode="numeric" placeholder="الرقم السري"></div>
        <div class="modal-actions">
          <button class="btn light" onclick="closeModal()">إلغاء</button>
          <button class="btn" onclick="logout()">تأكيد الخروج</button>
        </div>
      </div>
    </div>`;
}
function closeModal(){$("modalRoot").innerHTML=""}
async function logout(){
  const pin=$("logoutPin").value;
  if(!pin){toast("اكتب الرقم السري",true);return}
  try{
    await api("logout",{pin});
    token="";profile=null;appData=null;
    localStorage.removeItem("family_token");
    closeModal();
    $("app").classList.add("hidden");
    $("loginScreen").classList.remove("hidden");
    $("loginPin").value="";
    toast("تم تسجيل الخروج");
  }catch(e){toast(e.message,true)}
}

// استعادة الجلسة إذا كانت موجودة
async function restoreSession(){
  const saved=localStorage.getItem("family_token");
  if(!saved)return;
  token=saved;
  try{
    // التحقق من الجلسة عن طريق طلب البيانات
    const result=await api("get",{account_id:"azoz"});
    appData=result;
    profile=result.profile;
    if(profile.id!=="mama")selectedAccount=profile.id;
    $("loginScreen").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("userChip").textContent=profile.display_name||accountName(profile.id);
    buildNavigation();
    showPage("home");
  }catch{
    localStorage.removeItem("family_token");
    token="";
  }
}

restoreSession();
</script>
